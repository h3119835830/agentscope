name: CI

on:
  push:
    branches: [main, WINDOWS]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r backend/requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y build-essential libelf-dev zlib1g-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --manifest-path actplane/Cargo.toml --bin actplane
      - run: cargo build --release --manifest-path backend/dsl-adapter/Cargo.toml
      - run: mkdir -p /tmp/a
      - name: Prepare identity-sensitive reader accounts
        run: |
          getent group agentscope-task >/dev/null || sudo groupadd --system agentscope-task
          id -u agentscope-api >/dev/null 2>&1 || sudo useradd --system --no-create-home --shell /usr/sbin/nologin agentscope-api
          id -u agentscope-agent >/dev/null 2>&1 || sudo useradd --system --gid agentscope-task --home-dir /var/lib/agentscope-agent --no-create-home --shell /usr/sbin/nologin agentscope-agent
          id -u happy >/dev/null 2>&1 || sudo useradd --system --no-create-home --shell /usr/sbin/nologin happy
          sudo usermod -aG agentscope-task agentscope-api
          sudo install -d -m 0755 /opt/agentscope/bin
          sudo ln -sfn "$(command -v node)" /opt/agentscope/bin/node
          id agentscope-api
          test "$(id -gn agentscope-agent)" = agentscope-task
          test "$(readlink -f /opt/agentscope/bin/node)" = "$(readlink -f "$(command -v node)")"
      # Reference-reader tests exercise UID/GID and supplementary-group dropping.
      # conftest isolates the database, broker socket and worker settings.
      - run: sudo env "PATH=$PATH" PYTHONPATH=backend python -m pytest -q backend/tests
      - run: python -m compileall -q backend/agentscope_app backend/broker

  frontend-and-plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: node --test frontend/src/*.test.mjs
      - run: node --test scripts/scope_view.test.mjs scripts/managed_records.test.mjs integrations/dsh-managed-web/test/execution-lane.test.js integrations/dsh-managed-web/test/public-session.test.js integrations/dsh-managed-web/test/runtime-observation.test.js integrations/dsh-managed-web/test/transport.test.js
      - run: node --check integrations/dsh-agentscope/lib/index.js
      - run: node --check actplane/integrations/dsh-feedback/lib/index.js
      - run: node -e "for (const p of ['./integrations/dsh-agentscope/package.json','./actplane/integrations/dsh-feedback/package.json']) JSON.parse(require('fs').readFileSync(p, 'utf8'))"

  actplane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y build-essential clang llvm libelf-dev zlib1g-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - run: make -C actplane/bpf test
      - run: cargo test --manifest-path actplane/Cargo.toml --workspace
