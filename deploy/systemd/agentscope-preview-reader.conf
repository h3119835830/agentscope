[Service]
User=root
Group=root
SupplementaryGroups=agentscope
CapabilityBoundingSet=CAP_SETUID CAP_SETGID
AmbientCapabilities=CAP_SETUID CAP_SETGID
Environment=AGENTSCOPE_API_USER=agentscope
Environment=AGENTSCOPE_REFERENCE_READER_USER=agentscope-agent
