Environment=AGENTSCOPE_REFERENCE_READER_RUNTIME=/opt/agentscope/reader-runtime
ExecStart=
ExecStart=/opt/agentscope/current/.venv/bin/python /opt/agentscope/current/scripts/ecs_api_with_reader.py
