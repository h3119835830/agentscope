地发送。请使用脱敏流程。", "evidence_uids": [], "origin": "论文 §3.3 的 IFC 示例", "limitations": "基于来源标签而非文件内容扫描；会保守传播且可能过度污染。已建立连接、send/recv、IPC、继承环境和启动前历史都需要覆盖证据。"}, {"id": "P15", "name": "输出、隐私与业务承诺", "category": "通用约束", "scope": "semantic", "kind": "semantic", "target": "报告 / 消息 / 业务行为", "operation": "review", "effect": "notify", "reason": "请隐去隐私信息；结论注明证据；对外承诺前请求确认。", "evidence_uids": ["nearai__ironclaw::28"], "origin": "通用语义约束", "limitations": "可统一展示，但由内容检查、Agent 或业务授权接口执行。文件名命中与 notify 不能证明没有泄露或没有削弱鉴权。"}], "evidence": [{"uid": "AlexsJones__llmfit::17", "repo": "AlexsJones/llmfit", "source_file": "AlexsJones/llmfit/AGENTS.md", "source_lines": "75-83", "directive": "Do not manually edit `hf_models.json`. Regenerate it by running the scraper:\n\n```sh\npython3 scripts/scrape_hf_models.py\n```\n\nThe scraper has hardcoded fallback entries for gated models that require authentication.", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**\"\n  \n  rule regen-hf-models:\n    block write file \"data/hf_models.json\" if AGENT unless lineage-includes exec \"python*\"\n    because \"Do not manually edit data/hf_models.json; run python3 scripts/scrape_hf_models.py.\"\n", "enforceability": "per_event", "source_url": "https://github.com/AlexsJones/llmfit/blob/855ad3d34160cce6200c0ff128c34bcdcb0b922b/AGENTS.md#L75-L83", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch01/policies/AlexsJones__llmfit_17.yaml"}, {"uid": "OthmanAdi__planning-with-files::5", "repo": "OthmanAdi/planning-with-files", "source_file": "OthmanAdi/planning-with-files/AGENTS.md", "source_lines": "12-13", "directive": "- No `--no-verify`. No force push to master except tag ref updates.", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**\"\n  \n  rule no-noverify-or-force-master:\n    kill exec \"git\" \"--no-verify\" if AGENT\n    kill exec \"git\" \"--force\" if AGENT\n    kill exec \"git\" \"--force-with-lease\" if AGENT\n    because \"Do not use --no-verify, and do not force-push master except tag ref updates.\"\n", "enforceability": "per_event", "source_url": "https://github.com/OthmanAdi/planning-with-files/blob/fadbf1f6e31356628cc990de64f4b20a0fbe3378/AGENTS.md#L12-L13", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch06/policies/OthmanAdi__planning-with-files_5.yaml"}, {"uid": "abhigyanpatwari__GitNexus::2", "repo": "abhigyanpatwari/GitNexus", "source_file": "abhigyanpatwari/GitNexus/AGENTS.md", "source_lines": "7-16", "directive": "## Scope\n\n| Boundary | Rule |\n|----------|------|\n| **Reads** | `gitnexus/`, `gitnexus-web/`, `eval/`, plugin packages, `.github/`, `.gitnexus/`, docs. |\n| **Writes** | Only paths required for the change; keep diffs minimal. Update lockfiles when deps change. |\n| **Executes** | `npm`, `npx`, `node` under `gitnexus/` and `gitnexus-web/`; `uv run` for Python under `eval/`; documented CI/dev workflows. |\n| **Off-limits** | Real `.env` / secrets, production credentials, unrelated repos, destructive git ops without confirmation. |", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**/*\"\n  \n  rule gitnexus-scope:\n    block open file \"**/.env\" if AGENT\n    block open file \"**/secrets/**\" if AGENT\n    notify exec \"npm\" if AGENT\n    notify exec \"npx\" if AGENT\n    notify exec \"node\" if AGENT\n    notify exec \"uv\" if AGENT\n    because \"Stay within the documented read, write, and execution scope; real env files and secrets are off limits.\"\n", "enforceability": "per_event", "source_url": "https://github.com/abhigyanpatwari/GitNexus/blob/51e667808aea7ed5a5872514aae6b8a5fd28737c/AGENTS.md#L7-L16", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch02/policies/abhigyanpatwari__GitNexus__2.yaml"}, {"uid": "chenhg5__cc-connect::29", "repo": "chenhg5/cc-connect", "source_file": "chenhg5/cc-connect/AGENTS.md", "source_lines": "152-154", "directive": "- Tests must pass before committing: `go test ./...`", "policy_yaml": "version: 1\npolicy: |\n  source CODE = file \"**/*.go\"\n  \n  rule go-test-before-commit:\n    notify exec \"git\" \"commit\" if CODE unless after exec \"go\" since write \"**/*.go\"\n    because \"Run go test ./... before committing; tests must pass.\"\n", "enforceability": "cross_event", "source_url": "https://github.com/chenhg5/cc-connect/blob/e055bc8cf5e2fa6c976b657fa3cee40f7839d5dc/AGENTS.md#L152-L154", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch07/policies/chenhg5__cc-connect_29.yaml"}, {"uid": "chenhg5__cc-connect::38", "repo": "chenhg5/cc-connect", "source_file": "chenhg5/cc-connect/AGENTS.md", "source_lines": "210-218", "directive": "## Pre-Commit Checklist\n\n1. **Build passes**: `go build ./...`\n2. **Tests pass**: `go test ./...`\n3. **No new hardcoded platform/agent names in core**: grep for platform names in `core/*.go`\n4. **i18n complete**: all new user-facing strings have translations for all languages\n5. **No secrets in code**: no API keys, tokens, or credentials in source files", "policy_yaml": "version: 1\npolicy: |\n  source CODE = file \"**/*.go\"\n  source I18N = file \"i18n/**\"\n  \n  rule precommit-checklist:\n    notify exec \"git\" \"commit\" if CODE unless after exec \"go\" since write \"**/*.go\"\n    notify write file \"core/*.go\" if CODE\n    notify exec \"git\" \"commit\" if I18N\n    because \"Before commit, run go build, go test, avoid new hardcoded platform or agent names in core, and complete i18n.\"\n", "enforceability": "cross_event", "source_url": "https://github.com/chenhg5/cc-connect/blob/e055bc8cf5e2fa6c976b657fa3cee40f7839d5dc/AGENTS.md#L210-L218", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch07/policies/chenhg5__cc-connect_38.yaml"}, {"uid": "colbymchenry__codegraph::51", "repo": "colbymchenry/codegraph", "source_file": "colbymchenry/codegraph/CLAUDE.md", "source_lines": "158-161", "directive": "**Do not run `npm publish`, `git push`, or `git tag` yourself** — these are\npublish actions on shared state. Write the files, hand the user the commands.", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**\"\n\n  rule no-publish-shared-state:\n    kill exec \"npm\" \"publish\" if AGENT\n    kill exec \"git\" \"push\" if AGENT\n    kill exec \"git\" \"tag\" if AGENT\n    because \"do not run publish actions on shared state; write files and hand commands to the user\"\n", "enforceability": "per_event", "source_url": "https://github.com/colbymchenry/codegraph/blob/c9d2a25b73c3fc66c0f464a1ec0e0eb1cf53de65/CLAUDE.md#L158-L161", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch05/policies/colbymchenry__codegraph__51.yaml"}, {"uid": "earendil-works__pi::22", "repo": "earendil-works/pi", "source_file": "earendil-works/pi/AGENTS.md", "source_lines": "32-33", "directive": "- For `packages/coding-agent/test/suite/`, use `test/suite/harness.ts` + the faux provider. No real provider APIs, keys, or paid tokens.", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**/*\"\n  \n  source SUITE = file \"packages/coding-agent/test/suite/**\"\n  \n  rule suite-no-real-provider:\n    block connect endpoint \"*\" if AGENT and SUITE\n    because \"For coding-agent suite tests, use the harness and faux provider; no real provider APIs, keys, or paid tokens.\"\n", "enforceability": "per_event", "source_url": "https://github.com/earendil-works/ TS.md#L64-L65", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch02/policies/earendil-works__pi__39.yaml"}, {"uid": "nearai__ironclaw::28", "repo": "nearai/ironclaw", "source_file": "nearai/ironclaw/AGENTS.md", "source_lines": "61-62", "directive": "- Do not weaken bearer-token auth, webhook auth, CORS/origin checks, body limits, rate limits, allowlists, or secret-handling guarantees.", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**\"\n  \n  rule preserve-security-guarantees:\n    notify write file \"**/*auth*\" if AGENT\n    notify write file \"**/*cors*\" if AGENT\n    notify write file \"**/*secret*\" if AGENT\n    notify write file \"**/*rate*\" if AGENT\n    because \"Do not weaken auth, CORS, body limits, rate limits, allowlists, or secret-handling guarantees.\"\n", "enforceability": "per_event", "source_url": "https://github.com/nearai/ironclaw/blob/1ecb16907d18430da9071fe16c8eee85eec3d674/AGENTS.md#L61-L62", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch01/policies/nearai__ironclaw_28.yaml"}, {"uid": "openclaw__openclaw::123", "repo": "openclaw/openclaw", "source_file": "openclaw/openclaw/AGENTS.md", "source_lines": "156-157", "directive": "- Do not delete/rename unexpected files; ask if blocking, else ignore.", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**\"\n\n  rule no-unexpected-delete:\n    notify unlink file \"**\" if AGENT\n    because \"do not delete or rename unexpected files; ask if blocking, else ignore\"\n", "enforceability": "per_event", "source_url": "https://github.com/openclaw/openclaw/blob/b6c8807ca0ffe27326f7594767ad63c336556c8a/AGENTS.md#L156-L157", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch04/policies/openclaw__openclaw__123.yaml"}, {"uid": "ruvnet__ruflo::30", "repo": "ruvnet/ruflo", "source_file": "ruvnet/ruflo/AGENTS.md", "source_lines": "313-314", "directive": "- NEVER commit secrets or .env files", "policy_yaml": "version: 1\npolicy: |\n  source AGENT = exec \"**\"\n  source SECRET = file \"**/.env\"\n  source SECRET = file \"**/*secret*\"\n  \n  rule no-secret-commits:\n    block exec \"git\" \"commit\" if SECRET\n    block write file \"**/.env\" if AGENT\n    because \"Never commit secrets or .env files.\"\n", "enforceability": "per_event", "source_url": "https://github.com/ruvnet/ruflo/blob/b8a2faa3e9ef5a83a89486d792f6f301c1f8f110/AGENTS.md#L313-L314", "artifact_url": "https://github.com/eunomia-bpf/ActPlane/blob/63db86945c9b8618a46aa68c8de214bc4b8343d9/docs/eval_runs/rq1-expressiveness/full-607-subagents/batches/batch01/policies/ruvnet__ruflo_30.yaml"}, {"uid": "zeroclaw-labs__zeroclaw::34", "repo": "zeroclaw-labs/zeroclaw", "source_file": "zeroclaw-labs/zeroclaw/AGENTS.md", "source_lines": "205-216", "directive": "Dev-operational contracts — files consumed by AI coding skills and development tooling. Do not move or delete without updating all consuming skills and AGENTS.md:\n\n| Protected file | Consuming skill / tool |\n|---|---|\n| `docs/book/src/contributing/pr-review-protocol.md` | `github-pr-review-session` — review protocol |\n| `docs/book/src/maintainers/changelog-generation.md` | `changelog-generation` — release procedure |\n| `docs/book/src/maintainers/reviewer-playbook.md` | `github-issue-triage` — triage governance |\n| `docs/book/src/maintainers/pr-workflow.md` | `github-issue-triage` — triage discipline |\n| `docs/book/src/contributing/privacy.md` | `github-issue-triage`, PR template — privacy rules |\n| `docs/book/src/foundations/fnd-00*.md` | `github-pr-review-session` — RFC reference data; public transparency documents |", "policy_yaml": "version: 1\npolicy: |\n  source AG <script>
'use strict';
const catalogue=JSON.parse(document.getElementById('catalogue-data').textContent);
const templates=catalogue.templates, byId=Object.fromEntries(templates.map(t=>[t.id,t]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actionName={block:'阻止 + 反馈',notify:'仅通知',kill:'终止违规进程（事后）'};
const opName={read:'读取',open:'打开',write:'写入',unlink:'删除',exec:'执行',connect:'连接',commit:'提交',review:'检查内容'};

const defaults=Object.fromEntries(templates.map(t=>[t.id,{...clone(t),enabled:['P01','P02','P04'].includes(t.id)}]));
const baselineDraft=clone(defaults),sessionBaseline=clone(defaults);
let taskDraft=clone(defaults);taskDraft.P06.enabled=true;taskDraft.P11.enabled=true;taskDraft.P15.enabled=true;
taskDraft.C01={...clone(defaults.P06),id:'C01',name:'测试子 Agent 写入范围',target:'/workspace/tests/**',enabled:true};byId.C01=clone(taskDraft.C01);
let page='overview',tab='permissions',domain='D-A',category='all',search='',changeState='pending',editContext=null,lastOpener=null;
let baselineRevision=1,toastTimer,sessionFilter='all',sessionSearch='';
function toast(message){const n=document.getElementById('toast');n.textContent=message;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,4500)}

function selectedRules(){
  const local=domain==='D-B'?['P13','P15']:['P06','P11','P15'];
  return [
    ...['P01','P02','P04'].map(id=>({...sessionBaseline[id],inherited:true,sourceLabel:'平台底线',sourceDetail:'基线 v0.1'})),
    ...local.map(id=>({...taskDraft[id],inherited:domain==='D-A1',sourceLabel:domain==='D-A1'?'父任务':id==='P15'?'用户设置':'场景 Agent',sourceDetail:domain==='D-A1'?'来自 D-A':''})),
    ...(domain==='D-A1'?[{...taskDraft.C01,inherited:false,sourceLabel:'场景 Agent',sourceDetail:'本会话新增'}]:[])
  ];
}
function capability(rule){if(rule.kind==='branch')return '缺少可信分支识别与事前控制';if(rule.kind==='semantic')return '内容 / Agent 检查';if(['argv','gate'].includes(rule.kind))return '命令参数仅支持事后处置';if(rule.kind==='flow')return '需要数据流和网络覆盖验收';if(rule.kind==='network')return '需要端点与连接覆盖验收';return '可编译为 OS 规则 · 待验收'}
function ruleTable(rules){
  return `<div class="panel"><div class="table-wrap"><table class="records rules-table" aria-label="会话安全规则">
    <thead><tr><th>规则 / 保护对象</th><th>操作</th><th>处置</th><th>来源</th><th>状态</th><th></th></tr></thead>
    <tbody>${rules.map(r=>`<tr data-rule="${r.id}">
      <td data-label="规则"><strong>${esc(r.name)}</strong><code>${esc(r.target)}</code></td>
      <td data-label="操作">${['P06','C01'].includes(r.id)?'范围外写入':opName[r.operation]}</td>
      <td data-label="处置"><span class="record-effect ${r.kind==='semantic'?'semantic':''}">${r.kind==='semantic'?'内容检查 / 提醒':esc(actionName[r.effect])}</span></td>
      <td data-label="来源"><span class="source-label">${esc(r.sourceLabel)}</span>${r.inherited?'<small>继承 · 不可关闭</small>':''}</td>
      <td data-label="状态"><span class="badge">未加载</span></td>
      <td><button class="text-action" data-edit="${r.id}" data-context="session">${r.inherited?'查看':'配置'}</button></td>
    </tr>`).join('')}</tbody></table></div>${rules.length?'':'<div class="empty">没有匹配的规则</div>'}</div>`;
}
function renderPlatform(){
  const visible=templates.filter(t=>(category==='all'||t.category===category)&&(`${t.name}${t.target}${t.origin}`.toLowerCase().includes(search.toLowerCase())));
  return `<div class="toolbar"><label class="sr" for="search">搜索策略</label><input id="search" type="search" placeholder="搜索文件、Git、网络或策略名称" value="${esc(search)}"><label class="sr" for="category">策略类别</label><select id="category"><option value="all">全部类别</option>${[...new Set(templates.map(t=>t.category))].map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="record-count">${visible.length} 条记录</span></div>
    <div class="panel"><div class="table-wrap"><table class="records platform-table" aria-label="平台策略记录"><thead><tr><th>策略 / 来源</th><th>保护对象 / 操作</th><th>处置</th><th>草案</th><th></th></tr></thead><tbody>${visible.map(t=>{const r=baselineDraft[t.id];return `<tr data-rule="${r.id}"><td data-label="策略"><strong>${r.id} · ${esc(r.name)}</strong><small>${esc(r.origin)}</small></td><td data-label="对象 / 操作"><code>${esc(r.target)}</code>${opName[r.operation]}</td><td data-label="处置">${esc(actionName[r.effect])}</td><td data-label="草案"><span class="badge ${r.enabled?'blue':''}">${r.enabled?'已选用':'未选用'}</span>${r.kind==='branch'?'<small>暂不可执行</small>':''}</td><td><button class="text-action" data-edit="${r.id}" data-context="platform">配置</button></td></tr>`}).join('')}</tbody></table></div>${visible.length?'':'<div class="empty">没有匹配的模板</div>'}</div>`;
}
function openRuleDetails(r,opener){
  lastOpener=opener;const d=document.getElementById('inspector');
  d.innerHTML=`<div class="dialog-head"><h2 id="inspector-title">${esc(r.name)}</h2><button data-close="inspector" aria-label="关闭详情">×</button></div><div class="dialog-body"><dl class="kv"><dt>保护对象</dt><dd><code>${esc(r.target)}</code></dd><dt>操作</dt><dd>${['P06','C01'].includes(r.id)?'范围外写入':opName[r.operation]}</dd><dt>处置</dt><dd>${esc(actionName[r.effect])}</dd><dt>来源</dt><dd>${esc(r.sourceLabel)} · ${esc(r.sourceDetail)}<small>（继承规则，不可在本会话关闭）</small></dd><dt>状态</dt><dd>未加载 · 未验证</dd></dl><div class="reason-block"><label>反馈原因</label><p>${esc(r.reason)}</p></div><details><summary>技术与来源</summary><p style="margin-top:12px;font-size:12px">${esc(capability(r))}。${esc(r.limitations)}</p>${evidenceHtml(r)}<pre>${esc(preview(r))}</pre></details><div class="dialog-footer"><small>继承规则只读</small><button data-close="inspector">关闭</button></div></div>`;d.showModal();
}
function evidenceHtml(r){return r.evidence_uids.length?`<ul class="evidence-list">${r.evidence_uids.map(uid=>{const e=catalogue.evidence.find(x=>x.uid===uid);return `<li><a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">${esc(uid)} · 原文 ${esc(e.source_lines)} 行 ↗</a><br><span class="muted">${esc(e.directive.slice(0,550))}</span><br><a href="${esc(e.artifact_url)}" target="_blank" rel="noreferrer">冻结的 RQ1 策略 YAML</a></li>`}).join('')}</ul>`:'<p class="muted">来自用户需求或论文/架构扩展，没有直接对应的 RQ1 原文条目。</p>'}
function preview(r){const quoted=JSON.stringify(r.target),reason=JSON.stringify(r.reason);if(r.kind==='semantic')return '通用约束：'+r.reason+'\n执行方：Agent / 内容检查 / 权威业务接口\n不生成 OS 强制规则。';if(r.kind==='branch')return '配置意图（尚不可执行）：\nmain → '+actionName[r.mainEffect||'kill']+'\n其他分支 → '+actionName[r.otherEffect||'block']+'\n\n需要可信分支解析与事前引用更新控制；不生成 DSL。';if(r.kind==='argv'||r.kind==='gate'||r.kind==='flow')return JSON.stringify({status:'intent_only',target:r.target,effect:r.effect,reason:r.reason,required_checks:r.limitations},null,2);const fence=['P06','C01'].includes(r.id);let clause=r.kind==='network'?`${r.effect} connect endpoint "*" if AGENT unless target ${quoted}`:`${r.effect} ${r.operation} file ${fence?'"*"':quoted} if AGENT${fence?' unless target '+quoted:''}`;return `# 待可信路径解析、能力检查与独立验收的示例\nsource AGENT = exec "**"\nrule ${r.id.toLowerCase()}-draft:\n  ${clause}\n  because ${reason}`}
function openEditor(id,context,opener){lastOpener=opener;const r=context==='platform'?baselineDraft[id]:selectedRules().find(t=>t.id===id),locked=context==='session'&&r.inherited;if(locked){openRuleDetails(r,opener);return}editContext={id,context,locked};const dialog=document.getElementById('editor');dialog.innerHTML=`<div class="dialog-head"><div><h2 id="editor-title">${esc(r.name)}</h2><small>${esc(r.origin)}</small></div><button data-close="editor" aria-label="关闭规则配置">×</button></div><form id="rule-form" class="dialog-body">${context==='platform'?`<label class="check"><input id="enabled" type="checkbox" ${r.enabled?'checked':''}>纳入平台基线草案</label>`:''}<label class="field"><span>保护对象 / 目标</span><input id="target" value="${esc(r.target)}" maxlength="2048" ${locked||['branch','argv','gate','flow','semantic'].includes(r.kind)?'disabled':''}><small>示例路径，可按实际环境调整。</small></label>${r.kind==='branch'?`<div class="field-grid"><label class="field"><span>提交 main 时</span><select id="main-effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${(r.mainEffect||'kill')===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>提交其他分支时</span><select id="other-effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${(r.otherEffect||'block')===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="notice" style="margin-top:14px">此处用于记录你的配置需求。当前后端不能从 git commit 参数识别实际分支，带参数的事前 block 也不受支持。保存后仍是不可执行的需求草案。</div>`:`<div class="field-grid"><label class="field"><span>操作</span><select id="operation" ${locked||!['file'].includes(r.kind)?'disabled':''}>${(r.kind==='file'?['read','open','write','unlink']:[r.operation]).map(k=>`<option value="${k}" ${r.operation===k?'selected':''}>${opName[k]}</option>`).join('')}</select></label><label class="field"><span>处置方式</span><select id="effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${r.effect===k?'selected':''} ${k==='block'&&['argv','gate'].includes(r.kind)||r.kind==='semantic'&&k!=='notify'?'disabled':''}>${v}</option>`).join('')}</select></label></div>`}<label class="field"><span>反馈给 Agent 的原因</span><textarea id="reason" rows="3" maxlength="500" required ${locked?'disabled':''}>${esc(r.reason)}</textarea><small>写明限制原因与可行的下一步；最多 500 字符。</small></label><button type="button" data-default-reason ${locked?'disabled':''}>使用默认反馈</button><details><summary>技术与来源</summary><p style="margin-top:12px;font-size:12px">${esc(capability(r))}。${esc(r.limitations)}</p>${evidenceHtml(r)}<pre id="dsl-preview">${esc(preview(r))}</pre></details><div id="form-error" class="error" role="alert"></div><div class="dialog-footer"><small>${locked?'继承规则只读':'仅保存草案 · 未加载'}</small><div class="row"><button type="button" data-close="editor">${locked?'关闭':'取消'}</button>${locked?'':`<button class="primary" type="submit">${r.kind==='branch'?'保存需求草案':'保存草案'}</button>`}</div></div></form>`;dialog.showModal()}
function editorValue(){const r=clone(editContext.context==='platform'?baselineDraft[editContext.id]:taskDraft[editContext.id]);r.target=document.getElementById('target').value.trim();r.reason=document.getElementById('reason').value.trim();if(document.getElementById('enabled'))r.enabled=document.getElementById('enabled').checked;if(r.kind==='branch'){r.mainEffect=document.getElementById('main-effect').value;r.otherEffect=document.getElementById('other-effect').value}else{r.operation=document.getElementById('operation').value;r.effect=document.getElementById('effect').value}return r}
function closeDialog(id){document.getElementById(id).close();if(lastOpener?.isConnected)lastOpener.focus()}
function inspect(kind,opener){
  lastOpener=opener;let title='',body='',footer='<button data-close="inspector">关闭</button>';
  if(kind==='check'){
    title='检查结果';
    body=`<dl class="kv"><dt>结论</dt><dd><span class="badge amber">未验证</span></dd><dt>继承规则</dt><dd>已锁定编辑</dd><dt>编译能力</dt><dd>未检查当前会话</dd><dt>批准与加载</dt><dd>缺少回执</dd><dt>进程绑定</dt><dd>缺少回执</dd><dt>阻断与反馈</dt><dd>尚无实测记录</dd></dl><div class="notice">缺少运行时证据，无法判断会话是否已受到保护。</div>`;
  }else if(kind==='change'){
    title='测试子 Agent 写入范围';
    body=`<dl class="kv"><dt>目标域</dt><dd>D-A1</dd><dt>来源</dt><dd>场景 Agent</dd><dt>原范围</dt><dd><code>/workspace/**</code></dd><dt>新范围</dt><dd><code>/workspace/tests/**</code></dd><dt>处置</dt><dd>阻止 + 反馈</dd><dt>状态</dt><dd>${changeState==='pending'?'待处理':changeState==='draft'?'草案 · 未加载':'已拒绝'}</dd></dl><div class="reason-block"><label>新增原因</label><p>测试任务已交给子 Agent，因此将写入权限缩小到 tests 目录。</p></div><div class="reason-block"><label>反馈原因</label><p>你是测试子 Agent，请仅修改 tests 目录；产品代码变更请交回主 Agent。</p></div><details><summary>影响范围与生效条件</summary><p style="margin-top:12px">只影响 D-A1 及其后代；不能解除父域约束。尚未编译、批准或加载。</p></details>`;
    if(changeState==='pending')footer='<button data-change="rejected">拒绝</button><button class="primary" data-change="draft">存为待审草案</button>';
  }else if(kind==='draft'){

  if(page==='overview')context='<strong>演示工作区</strong><small>2 个示例会话</small>';
  if(page==='sessions'){
    if(sessionOpen){context=`<button class="back-button" data-all-sessions aria-label="返回会话列表">←</button><strong>${currentTask().name}</strong><small>${currentTask().id}</small>${domainOptions()}`;actions=`${domain!=='D-B'?`<button data-session-approvals>${changeState==='pending'?'待处理 · 1':'变更记录'}</button>`:''}<button data-inspect="check">检查安全配置</button>`;}
    else context='<strong>2 个会话</strong><small>示例任务</small>';
  }
  if(page==='approvals')context=`<strong>${changeState==='pending'?'1 项待处理':'暂无待处理项'}</strong><small>统一变更记录</small>`;
  if(page==='library')context='<strong>15 个策略模板</strong><small>研究来源与复用</small>';
  if(page==='system'){context=systemView==='baseline'?`<strong>基线 v0.${baselineRevision}</strong><span class="muted">草案 · 新建会话</span>`:'<strong>执行环境</strong><small>证据与能力</small>';if(systemView==='baseline')actions='<button class="primary" data-inspect="draft">查看基线草案</button>';}
  document.getElementById('context').innerHTML=context;document.getElementById('page-actions').innerHTML=actions;
  document.getElementById('content').innerHTML=({overview:renderOverview,sessions:renderSessions,approvals:renderApprovals,library:renderLibrary,system:renderSystem})[page]();
  document.querySelectorAll('[data-page]').forEach(n=>{n.classList.toggle('on',n.dataset.page===page);n.setAttribute('aria-current',n.dataset.page===page?'page':'false');});
  document.querySelector('[data-count="approvals"]').textContent=changeState==='pending'?'1':'';
  const canvas=document.querySelector('.diagram-canvas');if(canvas){graphResize.observe(canvas);requestAnimationFrame(drawEdges);}
}
function showDetails(title,body,footer,opener,drawer=false){lastOpener=opener;const d=document.getElementById('inspector');d.className=drawer?'side-drawer':'';d.innerHTML=`<div class="dialog-head"><h2 id="inspector-title">${esc(title)}</h2><button data-close="inspector" aria-label="关闭详情">×</button></div><div class="dialog-body">${body}<div class="dialog-footer">${footer||'<button data-close="inspector">关闭</button>'}</div></div>`;d.showModal();}
function inspectNode(id,opener){
  const n=graphNodes.get(id);if(!n)return;
  const ruleScope=n.scope==='D0'?currentTask().root:(n.scope||n.ruleScope);
  const body=`<dl class="kv"><dt>类型</dt><dd>${esc(n.type)}</dd><dt>关联会话</dt><dd>${currentTask().id}</dd>${n.pid?`<dt>PID / 父 PID</dt><dd>${n.pid} / ${n.ppid}（样例）</dd>`:''}${n.scope?`<dt>配置目标域</dt><dd>${n.scope}</dd>`:''}<dt>关联信息</dt><dd>${esc(n.meta)}</dd><dt>运行观测</dt><dd>样例 · 未核验</dd><dt>OS 策略绑定</dt><dd>未验证</dd></dl>${n.note?`<p class="list-subtle" style="margin-top:20px">${esc(n.note)}</p>`:''}`;
  showDetails(n.name,body,ruleScope?`<button class="primary" data-node-rules="${ruleScope}" ${n.scope==='D0'?'data-only-inherited':''}>${n.ruleScope?'查看会话约束':'查看约束'}</button>`:'<button data-close="inspector">关闭</button>',opener,true);
}
function inspectLifecycle(opener){
  showDetails('聊天会话与进程',`<ol class="lifecycle-steps"><li><strong>打开或新建会话</strong><p>DSH Web 宿主创建或恢复 Session，按需取得进程内 Agent 对象。打开页面本身不等于新建一个 OS 进程。</p></li><li><strong>发送消息</strong><p>Agent 开始一轮运行；调用 shell 等工具时，才可能启动工具子进程。</p></li><li><strong>回复完成</strong><p>Agent 回到空闲，宿主服务通常继续运行。下条消息可复用会话；历史仍存在不代表 Agent 对象或工具进程一直存活。</p></li><li><strong>停止或重新打开</strong><p>取消一轮回复、关闭页面、停止宿主是不同动作。宿主退出后，历史会话可以恢复，PID 可能变化。一次性 headless 命令则在本轮完成并保存后退出。</p></li></ol><details><summary>实现依据与安全含义</summary><p>本机 DSH 0.2.0-rc.2：SessionController 查找或恢复 Agent；Agent loop 有 idle 状态；headless 等待 whenIdle 后调用 exit。进程内子 Agent 可以共享宿主 PID。会话隔离需可信的执行身份与工具/进程绑定，不能只靠会话名称或共享 PID。</p><p>以上为代码核对；当前原型未观测真实进程，也未执行聊天生命周期实验。</p></details>`,null,opener);
}
function inspectTemplate(id,opener){const r=byId[id];showDetails(r.name,`<dl class="kv"><dt>来源</dt><dd>${esc(r.origin)}</dd><dt>保护对象</dt><dd><code>${esc(r.target)}</code></dd><dt>默认处置</dt><dd>${esc(actionName[r.effect])}</dd><dt>反馈原因</dt><dd>${esc(r.reason)}</dd></dl><details><summary>能力与研究依据</summary><p style="margin-top:12px">${esc(capability(r))}。${esc(r.limitations)}</p>${evidenceHtml(r)}</details>`,`<button class="primary" data-use-template="${id}">到平台底线配置</button>`,opener);}
function inspectVersion(id,opener){const rules=selectedRules().filter(r=>id==='baseline'?r.sourceLabel==='平台底线':id==='child'?r.id==='C01':r.sourceLabel!=='平台底线'&&r.id!=='C01');showDetails(id==='baseline'?'平台继承快照':id==='child'?'子域规则草案':'任务规则草案',`<dl class="kv"><dt>会话</dt><dd>${currentTask().id}</dd><dt>来源</dt><dd>${id==='baseline'?'基线 v0.1 · 创建时冻结':'当前任务草案'}</dd><dt>规则数</dt><dd>${rules.length}</dd><dt>加载状态</dt><dd>未加载</dd></dl><details><summary>规则记录</summary><ul>${rules.map(r=>`<li>${esc(r.name)}</li>`).join('')}</ul></details>`,null,opener);}
document.addEventListener('click',e=>{
  const n=e.target.closest('button');if(!n)return;
  if(n.dataset.page){page=n.dataset.page;render();}
  else if(n.dataset.view)setView(n.dataset.view,n.dataset.value);
  else if(n.dataset.session){openSession(n.dataset.session,n.dataset.openView||'permissions');render();}
  else if(n.hasAttribute('data-all-sessions')){sessionOpen=false;render();}
  else if(n.dataset.relation){relationView=n.dataset.relation;render();}
  else if(n.hasAttribute('data-session-approvals')){approvalScope=currentTask().id;page='approvals';render();}
  else if(n.dataset.node)inspectNode(n.dataset.node,n);
  else if(n.hasAttribute('data-lifecycle'))inspectLifecycle(n);
  else if(n.dataset.nodeRules){closeDialog('inspector');setDomain(n.dataset.nodeRules);tab='permissions';if(n.hasAttribute('data-only-inherited'))sessionFilter='inherited';render();}
  else if(n.dataset.nodeSession){closeDialog('inspector');openSession(n.dataset.nodeSession,'relations');render();}
  else if(n.dataset.template)inspectTemplate(n.dataset.template,n);
  else if(n.dataset.useTemplate){closeDialog('inspector');page='system';systemView='baseline';category='all';search='';render();openEditor(n.dataset.useTemplate,'platform',document.querySelector(`[data-edit="${n.dataset.useTemplate}"]`));}
  else if(n.dataset.version)inspectVersion(n.dataset.version,n);
  else if(n.hasAttribute('data-service-map')){page='overview';overviewView='services';render();}
  else if(n.dataset.fileRule){if(n.dataset.fileRule==='C01')setDomain('D-A1');tab='permissions';sessionSearch=(byId[n.dataset.fileRule]||{}).name||'';render();}
  else if(n.dataset.edit){document.getElementById('inspector').className='';openEditor(n.dataset.edit,n.dataset.context,n);}
  else if(n.dataset.close)closeDialog(n.dataset.close);
  else if(n.dataset.inspect){document.getElementById('inspector').className='';inspect(n.dataset.inspect,n);}
  else if(n.hasAttribute('data-default-reason')){document.getElementById('reason').value=byId[editContext.id].reason;document.getElementById('dsl-preview').textContent=preview(editorValue());}
  else if(n.dataset.change){changeState=n.dataset.change;document.getElementById('inspector').close();render();toast(changeState==='draft'?'建议已存为待审草案；尚未加载。':'已拒绝这条示例建议。');}
});
document.addEventListener('change',e=>{
  if(e.target.id==='domain'){setDomain(e.target.value);render();}
  else if(e.target.id==='category'){category=e.target.value;render();}
  else if(e.target.id==='session-source'){sessionFilter=e.target.value;render();}
  else if(e.target.id==='connection-scope'){connectionScope=e.target.value;render();}
  else if(e.target.id==='approval-scope'){approvalScope=e.target.value;render();}
  else if(e.target.id==='library-category'){libraryCategory=e.target.value;render();}
});
document.addEventListener('input',e=>{
  if(['search','session-search','library-search'].includes(e.target.id)){const id=e.target.id,value=e.target.value;if(id==='search')search=value;else if(id==='session-search')sessionSearch=value;else librarySearch=value;render();document.getElementById(id).focus();}
  else if(e.target.closest('#rule-form')&&!editContext.locked)document.getElementById('dsl-preview').textContent=preview(editorValue());
});
document.addEventListener('keydown',e=>{
  if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();
  const tabs=[...e.target.closest('[role="tablist"]').querySelectorAll('[role="tab"]')],index=tabs.indexOf(e.target),next=e.key==='Home'?tabs[0]:e.key==='End'?tabs.at(-1):tabs[(index+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length];
  setView(next.dataset.view,next.dataset.value);document.getElementById(next.id).focus();
});

document.addEventListener('submit',e=>{if(e.target.id!=='rule-form')return;e.preventDefault();if(editContext.locked)return;const r=editorValue();if(!r.reason||!r.target){document.getElementById('form-error').textContent='请填写保护对象与反馈原因。';return}if(r.kind==='file'&&!r.target.startsWith('/')){document.getElementById('form-error').textContent='请使用绝对路径；可信侧还需解析实际对象。';return}if(editContext.context==='platform'){baselineDraft[r.id]=r;baselineRevision++}else taskDraft[r.id]=r;closeDialog('editor');render();toast(r.kind==='branch'?'分支策略需求已保存；当前不可执行。':'草案已保存，尚未编译、批准或加载。')});
for(const id of ['editor','inspector'])document.getElementById(id).addEventListener('cancel',()=>{if(lastOpener?.isConnected)lastOpener.focus()});
render();
</script></body></html>
