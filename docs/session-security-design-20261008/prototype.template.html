<!doctype html>
<html lang="zh-CN">
<head>

<title>AgentScope · 平台底线与会话安全配置</title>
<style>
:root{--nav:#0f1c2e;--blue:#1f6feb;--bg:#f5f7fa;--line:#e3e8ef;--ink:#172b43;--muted:#63758a;--soft:#edf3fc;--amber:#8c580c;--red:#ad322c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 "Microsoft YaHei",system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #cbd5e1;background:white;color:var(--ink);border-radius:7px;padding:7px 12px}button:hover{background:#f0f5fd}button:focus-visible,a:focus-visible{outline:3px solid #86b7ff;outline-offset:2px}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.65}input,select,textarea{border:1px solid #c7d2df;background:white;border-radius:7px;padding:8px 10px;color:var(--ink);max-width:100%}textarea{width:100%;resize:vertical}a{color:var(--blue)}code,pre{font-family:Consolas,monospace;font-size:12px}code{overflow-wrap:anywhere}pre{background:#f3f6fa;padding:13px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}h1,h2,h3,p{margin-top:0}h1{font-size:24px;line-height:1.4;margin-bottom:7px}h2{font-size:16px;margin-bottom:4px}h3{font-size:14px}p{margin-bottom:9px}small,.muted{color:var(--muted)}.shell{display:flex;min-height:100vh}.sidebar{width:216px;flex-shrink:0;padding:24px 14px;background:var(--nav);color:#b6c7dc;display:flex;flex-direction:column;gap:8px}.brand{display:flex;align-items:center;gap:10px;color:white;font-size:18px;padding:0 8px 25px}.logo{width:32px;height:32px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-weight:bold}.sidebar small{display:block;font-size:11px;color:#8fa5c0}.nav{border:0;background:transparent;color:#cbd9e9;text-align:left;padding:11px 13px}.nav.on{background:var(--blue);color:white}.side-footer{margin-top:auto;padding:25px 8px 0;font-size:11px}.main{flex:1;min-width:0}.topbar{min-height:54px;background:white;border-bottom:1px solid var(--line);padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:12px}.content{padding:25px 28px 55px;max-width:1340px}.badge{font-size:11px;display:inline-block;padding:2px 8px;border-radius:5px;background:#eef2f7;color:#516478;white-space:nowrap}.badge.blue{background:#e8f1ff;color:#235ca6}.badge.amber{background:#fff3dc;color:var(--amber)}.badge.red{background:#fdecea;color:var(--red)}.eyebrow{font-size:11px;letter-spacing:1.5px;color:var(--blue);margin-bottom:8px}.heading{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.heading p{color:var(--muted);max-width:760px}.panel{background:white;border:1px solid var(--line);border-radius:11px;padding:18px 20px;margin-bottom:16px}.notice{background:#fff7e7;color:#79500f;border:1px solid #f1dcaf;border-radius:8px;padding:11px 14px;margin-bottom:18px;font-size:12px}.notice.info{background:#edf4ff;border-color:#d3e3fd;color:#2a527e}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.metric{background:white;border:1px solid var(--line);border-radius:9px;padding:14px 18px}.metric strong{font-size:21px;display:block;margin-bottom:3px}.metric span{font-size:12px;color:var(--muted)}.toolbar,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.toolbar{margin-bottom:15px}.toolbar input{min-width:210px;flex:1}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}.tabs button{border:0;border-radius:0;background:transparent;white-space:nowrap;padding:10px 1px;color:var(--muted)}.tabs button.on{border-bottom:2px solid var(--blue);color:var(--blue);font-weight:bold}.permissions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.permission{border:1px solid var(--line);background:white;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:9px}.permission.locked{border-left:3px solid #7d91b0}.permission.semantic{border-left:3px solid #b99b44}.permission h3{font-size:14px;margin:0}.permission .target{font-size:12px;background:#f5f7fa;border-radius:5px;padding:6px 8px;overflow-wrap:anywhere}.permission .bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}.permission p{font-size:12px;margin:0;color:#52667f}.permission small{font-size:11px}.group-title{margin:20px 0 9px;display:flex;gap:9px;align-items:center}.group-title span{font-size:11px;color:var(--muted);font-weight:normal}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{text-align:left;color:var(--muted);font-weight:normal;background:#f8fafc}td,th{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{min-width:180px}td:last-child{white-space:nowrap}td strong{display:block;font-size:13px}td .badge{margin-top:4px}.change{max-width:800px;border-left:3px solid var(--blue)}.change dl{display:grid;grid-template-columns:85px 1fr;gap:7px;margin:15px 0}.change dt{color:var(--muted)}.change dd{margin:0}.change-actions{display:flex;gap:8px;margin-top:15px}.tree{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0}.tree div{border:1px solid #ccd9ea;border-radius:7px;padding:10px 15px;background:#f7faff}.tree span{color:#8aa1bf}.evidence-list{padding-left:19px;font-size:12px}.evidence-list li{margin:9px 0}.empty{padding:35px;text-align:center;color:var(--muted)}dialog{border:0;border-radius:12px;padding:0;width:min(690px,94vw);max-height:92vh;box-shadow:0 18px 75px #102d4c40;color:var(--ink)}dialog::backdrop{background:#0f1c2e65}.dialog-head{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}.dialog-head h2{margin:0}.dialog-body{padding:18px 22px}.field{display:block;margin:15px 0}.field>span{display:block;font-size:12px;font-weight:bold;margin-bottom:6px}.field>input:not([type=checkbox]),.field>select{width:100%}.field small{display:block;font-size:11px;margin-top:5px}.check{display:flex;align-items:center;gap:8px;font-size:12px}.check input{accent-color:var(--blue)}.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field-grid .field{margin:0}.dialog-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:15px;border-top:1px solid var(--line);margin-top:20px}details{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}summary{cursor:pointer;font-size:12px;color:#49647e}.error{color:var(--red);font-size:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:8px;background:var(--nav);color:white;z-index:10;max-width:92vw;font-size:12px}.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
@media(max-width:1000px){.sidebar{width:185px}.content{padding:22px 20px}.permissions{grid-template-columns:1fr}.topbar{padding:12px 20px}.metrics{grid-template-columns:repeat(3,minmax(0,1fr))}.metric strong{font-size:18px}}
@media(max-width:650px){.shell{display:block}.sidebar{width:100%;padding:10px 12px;display:flex;flex-direction:row;align-items:center;flex-wrap:wrap;gap:5px}.brand{padding:0;margin-right:auto;font-size:16px}.brand small,.side-footer{display:none}.logo{width:27px;height:27px}.nav{padding:7px 10px;font-size:12px}.topbar{font-size:12px;padding:10px 14px}.topbar a{display:none}.content{padding:20px 14px}.heading{display:block}.heading .row{margin-top:12px}h1{font-size:21px}.metrics{grid-template-columns:1fr}.metric{padding:10px 13px;display:flex;align-items:center;gap:12px}.metric strong{font-size:16px;min-width:95px;margin:0}.panel{padding:15px}.field-grid{grid-template-columns:1fr}.dialog-body{padding:15px 17px}.dialog-head{padding:14px 17px}.toolbar input{min-width:0}.tabs{gap:18px}.notice{font-size:11px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="logo">A</div><div>AgentScope<small>SESSION SECURITY</small></div></div><button class="nav on" data-page="session">◈ 会话安全</button><button class="nav" data-page="platform">▤ 平台安全底线</button><div class="side-footer">研究与配置原型 · v0.1<br>所有会话、进程和状态均为样例</div></aside>
<main class="main"><header class="topbar"><span id="breadcrumb">会话 / 安全配置</span><div class="row"><span class="badge amber">交互原型 · 未连接运行时</span><a href="AgentScope-界面原型-会话安全约束.html">原会话原型 ↗</a></div></header><div class="content" id="content"></div></main>
</div>
<dialog id="editor" aria-labelledby="editor-title"></dialog><dialog id="inspector" aria-labelledby="inspector-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script id="catalogue-data" type="application/json">__CATALOGUE_JSON__</script>
<script>
'use strict';
const catalogue=JSON.parse(document.getElementById('catalogue-data').textContent);
const templates=catalogue.templates, byId=Object.fromEntries(templates.map(t=>[t.id,t]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actionName={block:'阻止 + 反馈',notify:'仅通知',kill:'终止违规进程（事后）'};
const opName={read:'读取',open:'打开',write:'写入',unlink:'删除',exec:'执行',connect:'连接',commit:'提交',review:'检查内容'};
const clone=o=>JSON.parse(JSON.stringify(o));
const defaults=Object.fromEntries(templates.map(t=>[t.id,{...clone(t),enabled:['P01','P02','P04'].includes(t.id)}]));
const baselineDraft=clone(defaults),sessionBaseline=clone(defaults);
const taskDraft=clone(defaults);taskDraft.P06.enabled=true;taskDraft.P11.enabled=true;taskDraft.P15.enabled=true;
taskDraft.C01={...clone(defaults.P06),id:'C01',name:'测试子 Agent 写入范围',target:'/workspace/tests/**',enabled:true};byId.C01=clone(taskDraft.C01);
let page='session',tab='permissions',domain='D-A',category='all',search='',changeState='pending',editContext=null,lastOpener=null;
let baselineRevision=1,toastTimer;
function toast(message){const n=document.getElementById('toast');n.textContent=message;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,4500)}
function selectedRules(){const local=domain==='D-B'?['P13','P15']:['P06','P11','P15'];return [...['P01','P02','P04'].map(id=>({...sessionBaseline[id],inherited:true})),...local.map(id=>({...taskDraft[id],inherited:domain==='D-A1'})),...(domain==='D-A1'?[{...taskDraft.C01,inherited:false}]:[])]}
function capability(rule){if(rule.kind==='branch')return '缺少可信分支识别与事前控制';if(rule.kind==='semantic')return '内容 / Agent 检查';if(['argv','gate'].includes(rule.kind))return '命令参数仅支持事后处置';if(rule.kind==='flow')return '需要数据流和网络覆盖验收';if(rule.kind==='network')return '需要端点与连接覆盖验收';return '可编译为 OS 规则 · 待验收'}
function header(title,description,actions=''){return `<div class="heading"><div><div class="eyebrow">SAFETY WORKSPACE / DESIGN PROPOSAL</div><h1>${title}</h1><p>${description}</p></div><div class="row">${actions}</div></div>`}
function permissionCard(r){return `<article class="permission ${r.inherited?'locked':''} ${r.kind==='semantic'?'semantic':''}" data-rule="${r.id}"><div class="row"><h3>${esc(r.name)}</h3><span class="badge ${r.inherited?'':'blue'}">${r.inherited?'锁定 · 继承规则':'本会话草案'}</span></div><div class="target"><code>${esc(r.target)}</code> · ${opName[r.operation]}</div><p>${esc(r.reason)}</p><small>${esc(capability(r))}</small><div class="bottom"><span><span class="badge ${r.kind==='semantic'?'amber':'blue'}">${esc(actionName[r.effect])}</span> <span class="badge">未加载</span></span><button data-edit="${r.id}" data-context="session">${r.inherited?'查看规则':'配置草案'}</button></div></article>`}
function renderSession(){const rules=selectedRules();let body='';
 if(tab==='permissions')body=`<div class="notice info">这是会话权限清单。平台规则由上级授予，子域只能增加约束；你可以配置本会话草案。运行时接入后，应逐条显示加载和实测证据。</div><h2 class="group-title">继承的安全底线 <span>来自平台基线 v0.1 · 子会话不可关闭</span></h2><div class="permissions">${rules.filter(r=>r.inherited).map(permissionCard).join('')}</div><h2 class="group-title">本会话的约束 <span>用户配置与场景 Agent 提案</span></h2><div class="permissions">${rules.filter(r=>!r.inherited).map(permissionCard).join('')}</div>`;
 if(tab==='changes')body=`<div class="panel change"><div class="row"><span class="badge blue">场景 Agent 建议</span><span class="badge">${changeState==='pending'?'待配置检查':changeState==='draft'?'已存为草案 · 未加载':'已拒绝（样例）'}</span></div><h2 style="margin-top:13px">测试子 Agent 仅写入测试目录</h2><p class="muted">任务被拆分给测试子 Agent 后，将它的写入范围缩小。</p><dl><dt>目标域</dt><dd>D-A1 · 继承 D0 与 D-A</dd><dt>范围变化</dt><dd><code>/workspace/** → /workspace/tests/**</code></dd><dt>处置</dt><dd>阻止越界写入，并反馈原因</dd><dt>反馈原因</dt><dd>你是测试子 Agent，请仅修改 tests 目录；产品代码变更请交回主 Agent。</dd></dl><div class="notice">新约束只作用于 D-A1 及其后代。此处没有编译、批准、加载或内核接收回执。</div><div class="change-actions"><button class="primary" data-change="draft" ${changeState!=='pending'?'disabled':''}>存为待审草案</button><button data-change="rejected" ${changeState!=='pending'?'disabled':''}>拒绝建议</button></div></div>`;
 if(tab==='sources')body=`<div class="panel"><h2>这条约束从哪里来，约束谁</h2><div class="tree"><div><b>平台 D0</b><br><small>秘密、私钥、策略文件</small></div><span>→</span><div><b>任务 D-A</b><br><small>写入范围、提交条件</small></div><span>→</span><div><b>测试子域 D-A1</b><br><small>仅写 tests</small></div></div><p class="muted">普通 shell / pytest 子进程延续所属域；只有明确创建子域时才产生新的策略边界。图中的域和 PID 是示意，不能用来证明实时绑定。</p><p>关系：<code>policy(D) = policy(parent(D)) + local(D)</code></p><button data-inspect="sources">查看论文、RQ1 原始条目与修订意见</button></div>`;
 return header(domain==='D-B'?'研究任务 · 会话安全':'登录表单修复 · 会话安全','像查看应用权限一样，查看此会话及其子进程可访问的资源、限制条件与处置方式。',`<button data-inspect="check">检查安全配置</button>`)+`<div class="row" style="margin-bottom:17px"><span class="badge">Session S-DEMO · 样例</span><label class="row">查看域 <select id="domain" aria-label="查看策略域"><option value="D-A" ${domain==='D-A'?'selected':''}>任务 A / D-A</option><option value="D-A1" ${domain==='D-A1'?'selected':''}>测试子 Agent / D-A1</option><option value="D-B" ${domain==='D-B'?'selected':''}>研究任务 B / D-B</option></select></label></div><div class="metrics"><div class="metric"><strong>${rules.filter(r=>r.inherited).length} 条继承</strong><span>上级约束不可在此解除</span></div><div class="metric"><strong>${rules.filter(r=>!r.inherited).length} 条本地</strong><span>任务规则与通用行为约束</span></div><div class="metric"><strong>尚未验证</strong><span>无加载、进程绑定或探针回执</span></div></div><div class="tabs" role="tablist" aria-label="会话安全视图">${[['permissions','安全权限'],['changes','待处理变更'],['sources','约束来源']].map(([key,name])=>`<button role="tab" aria-selected="${tab===key}" data-tab="${key}" class="${tab===key?'on':''}">${name}${key==='changes'&&changeState==='pending'?' · 1':''}</button>`).join('')}</div>${body}`;
}
function renderPlatform(){const visible=templates.filter(t=>(category==='all'||t.category===category)&&(`${t.name}${t.target}${t.origin}`.toLowerCase().includes(search.toLowerCase())));return header('平台安全底线','先配置少量稳定的通用规则。任务路径、测试命令和业务目标由场景 Agent 补齐；运行时继续增加更严格的约束。',`<button class="primary" data-inspect="draft">查看基线草案</button>`)+`<div class="notice">当前编辑基线草案 v0.${baselineRevision}，默认面向新建会话。修改草案不会改变左侧已有会话的规则快照，也不会修改正在运行的安全策略。</div><div class="toolbar"><label class="sr" for="search">搜索策略</label><input id="search" type="search" placeholder="搜索文件、Git、网络或策略名称" value="${esc(search)}"><label class="sr" for="category">策略类别</label><select id="category"><option value="all">全部类别 · 15</option>${[...new Set(templates.map(t=>t.category))].map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="panel"><div class="table-wrap"><table><thead><tr><th>模板 / 来源</th><th>保护对象与操作</th><th>拟定处置</th><th>草案 / 能力</th><th>配置</th></tr></thead><tbody>${visible.map(t=>{const r=baselineDraft[t.id];return `<tr data-rule="${r.id}"><td><strong>${r.id} · ${esc(r.name)}</strong><span class="muted">${esc(r.origin)}</span></td><td><code>${esc(r.target)}</code><br>${opName[r.operation]}</td><td>${esc(actionName[r.effect])}</td><td><span class="badge ${r.enabled?'blue':''}">${r.enabled?'纳入基线草案':'可选模板'}</span><br><small>${esc(capability(r))}</small></td><td><button data-edit="${r.id}" data-context="platform">配置</button></td></tr>`}).join('')}</tbody></table></div>${visible.length?'':'<div class="empty">没有匹配的模板</div>'}</div><p class="muted" style="font-size:12px">已核对 607 份独立策略；本目录提炼 15 类候选模板，并保留 13 条 RQ1 证据。.ssh 为用户需求扩展，目录中已标明来源。</p>`}
function render(){document.getElementById('content').innerHTML=page==='session'?renderSession():renderPlatform();document.getElementById('breadcrumb').textContent=page==='session'?'会话 / 安全配置':'平台 / 安全底线';document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('on',n.dataset.page===page))}
function evidenceHtml(r){return r.evidence_uids.length?`<ul class="evidence-list">${r.evidence_uids.map(uid=>{const e=catalogue.evidence.find(x=>x.uid===uid);return `<li><a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">${esc(uid)} · 原文 ${esc(e.source_lines)} 行 ↗</a><br><span class="muted">${esc(e.directive.slice(0,550))}</span><br><a href="${esc(e.artifact_url)}" target="_blank" rel="noreferrer">冻结的 RQ1 策略 YAML</a></li>`}).join('')}</ul>`:'<p class="muted">来自用户需求或论文/架构扩展，没有直接对应的 RQ1 原文条目。</p>'}
function preview(r){const quoted=JSON.stringify(r.target),reason=JSON.stringify(r.reason);if(r.kind==='semantic')return '通用约束：'+r.reason+'\n执行方：Agent / 内容检查 / 权威业务接口\n不生成 OS 强制规则。';if(r.kind==='branch')return '配置意图（尚不可执行）：\nmain → '+actionName[r.mainEffect||'kill']+'\n其他分支 → '+actionName[r.otherEffect||'block']+'\n\n需要可信分支解析与事前引用更新控制；不生成 DSL。';if(r.kind==='argv'||r.kind==='gate'||r.kind==='flow')return JSON.stringify({status:'intent_only',target:r.target,effect:r.effect,reason:r.reason,required_checks:r.limitations},null,2);const fence=['P06','C01'].includes(r.id);let clause=r.kind==='network'?`${r.effect} connect endpoint "*" if AGENT unless target ${quoted}`:`${r.effect} ${r.operation} file ${fence?'"*"':quoted} if AGENT${fence?' unless target '+quoted:''}`;return `# 待可信路径解析、能力检查与独立验收的示例\nsource AGENT = exec "**"\nrule ${r.id.toLowerCase()}-draft:\n  ${clause}\n  because ${reason}`}
function openEditor(id,context,opener){lastOpener=opener;const r=context==='platform'?baselineDraft[id]:selectedRules().find(t=>t.id===id),locked=context==='session'&&r.inherited;editContext={id,context,locked};const dialog=document.getElementById('editor');dialog.innerHTML=`<div class="dialog-head"><div><h2 id="editor-title">${locked?'查看继承规则':'配置安全草案'} · ${esc(r.name)}</h2><small>${esc(r.origin)} · ${esc(capability(r))}</small></div><button data-close="editor" aria-label="关闭规则配置">×</button></div><form id="rule-form" class="dialog-body"><div class="notice ${locked?'info':''}">${locked?'此规则来自上级域，在本会话及子域中锁定。调整平台底线应创建新的版本并重新走批准与生效流程。':'保存只更新本页内存中的设计草案。没有调用运行时，也没有编译、批准或加载。'}</div>${context==='platform'?`<label class="check"><input id="enabled" type="checkbox" ${r.enabled?'checked':''}>纳入平台基线草案</label>`:''}<label class="field"><span>保护对象 / 目标</span><input id="target" value="${esc(r.target)}" maxlength="2048" ${locked||['branch','argv','gate','flow','semantic'].includes(r.kind)?'disabled':''}><small>文件路径需由可信侧解析；示例路径不会读取你的真实文件。</small></label>${r.kind==='branch'?`<div class="field-grid"><label class="field"><span>提交 main 时</span><select id="main-effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${(r.mainEffect||'kill')===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>提交其他分支时</span><select id="other-effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${(r.otherEffect||'block')===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="notice" style="margin-top:14px">此处用于记录你的配置需求。当前后端不能从 git commit 参数识别实际分支，带参数的事前 block 也不受支持。保存后仍是不可执行的需求草案。</div>`:`<div class="field-grid"><label class="field"><span>限制的操作</span><select id="operation" ${locked||!['file'].includes(r.kind)?'disabled':''}>${(r.kind==='file'?['read','open','write','unlink']:[r.operation]).map(k=>`<option value="${k}" ${r.operation===k?'selected':''}>${opName[k]}</option>`).join('')}</select></label><label class="field"><span>触发后的处置</span><select id="effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${r.effect===k?'selected':''} ${k==='block'&&['argv','gate'].includes(r.kind)||r.kind==='semantic'&&k!=='notify'?'disabled':''}>${v}</option>`).join('')}</select></label></div>`}<label class="field"><span>反馈给 Agent 的原因</span><textarea id="reason" rows="3" maxlength="500" required ${locked?'disabled':''}>${esc(r.reason)}</textarea><small>写明限制原因与可行的下一步；最多 500 字符。</small></label><button type="button" data-default-reason ${locked?'disabled':''}>使用默认反馈</button><label class="check" style="margin-top:14px"><input type="checkbox" disabled>同时终止整个会话 <small>需要独立的会话终止能力</small></label><details><summary>来源、适用边界与技术预览</summary><p style="margin-top:12px;font-size:12px">${esc(r.limitations)}</p>${evidenceHtml(r)}<pre id="dsl-preview">${esc(preview(r))}</pre></details><div id="form-error" class="error" role="alert"></div><div class="dialog-footer"><small>${locked?'继承规则只读':'草案有效 ≠ 策略已生效'}</small><div class="row"><button type="button" data-close="editor">${locked?'关闭':'取消'}</button>${locked?'':`<button class="primary" type="submit">${r.kind==='branch'?'保存需求草案':'保存草案'}</button>`}</div></div></form>`;dialog.showModal()}
function editorValue(){const r=clone(editContext.context==='platform'?baselineDraft[editContext.id]:taskDraft[editContext.id]);r.target=document.getElementById('target').value.trim();r.reason=document.getElementById('reason').value.trim();if(document.getElementById('enabled'))r.enabled=document.getElementById('enabled').checked;if(r.kind==='branch'){r.mainEffect=document.getElementById('main-effect').value;r.otherEffect=document.getElementById('other-effect').value}else{r.operation=document.getElementById('operation').value;r.effect=document.getElementById('effect').value}return r}
function closeDialog(id){document.getElementById(id).close();if(lastOpener?.isConnected)lastOpener.focus()}
function inspect(kind,opener){lastOpener=opener;let title='',body='';if(kind==='check'){title='安全配置检查 · 样例';body=`<p>当前只能检查配置表达与来源；缺少运行时回执，不能判断此会话已经受到保护。</p><table><tr><td>继承规则</td><td>界面锁定，展示来源版本</td></tr><tr><td>通用语义约束</td><td>已区分执行层，不能算作 OS 强制</td></tr><tr><td>编译与能力报告</td><td>未针对此会话执行</td></tr><tr><td>批准、加载、进程绑定</td><td><span class="badge amber">缺少证据</span></td></tr><tr><td>阻断实测与反馈送达</td><td><span class="badge amber">缺少证据</span></td></tr></table><div class="notice" style="margin-top:16px">生产界面应分别展示：草案 → 编译及能力检查 → 批准 → 加载 → 绑定/激活 → 独立探针验收。任何缺失步骤都不能显示“已保护”。</div>`}else if(kind==='draft'){title='平台基线草案 · 未提交';body=`<p>仅包含已勾选的模板。变更作用于新的基线版本，不会自动替换当前会话快照。</p><pre>${esc(JSON.stringify({schema:'agentscope.baseline.intent.v1',version:'draft-0.'+baselineRevision,runtime_applied:false,rules:Object.values(baselineDraft).filter(r=>r.enabled).map(r=>({template_id:r.id,target:r.target,operation:r.operation,effect:r.effect,reason:r.reason,execution_status:'unverified_intent',dsl_preview_available:['file','network'].includes(r.kind),needs_capability_and_runtime_validation:true,...(r.kind==='branch'?{main:r.mainEffect||'kill',other:r.otherEffect||'block'}:{})}))},null,2))}</pre>`}else{title='研究来源与使用边界';body=`<p>对照论文 §3.2–3.4、§5.2，冻结的 RQ1 材料与当前支持矩阵。研究策略不能直接当成已批准的平台规则。</p><p><a href="${catalogue.paper}" target="_blank" rel="noreferrer">ActPlane 论文 v2 ↗</a></p><p><b>607</b> 份独立策略：392 per-event，215 cross-event。<br>15 类候选模板，13 条原文证据；.ssh 为新增需求。</p><p>已逐份核对 YAML 与冻结 Git blob。<code>${catalogue.artifact_commit}</code></p><div class="notice">例如：提交前测试的原始 notify 规则没有证明测试成功；按单个 -f / reset 参数匹配会误伤；.env 标签不是提交内容扫描。模板必须重新审查和验收。</div>${catalogue.evidence.map(e=>`<p style="font-size:12px"><a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">${esc(e.uid)} · ${esc(e.source_lines)} 行</a></p>`).join('')}`}
const d=document.getElementById('inspector');d.innerHTML=`<div class="dialog-head"><h2 id="inspector-title">${title}</h2><button data-close="inspector" aria-label="关闭详情">×</button></div><div class="dialog-body">${body}<div class="dialog-footer"><small>研究与交互示意</small><button data-close="inspector">关闭</button></div></div>`;d.showModal()}
document.addEventListener('click',e=>{const n=e.target.closest('button');if(!n)return;if(n.dataset.page){page=n.dataset.page;render()}else if(n.dataset.tab){tab=n.dataset.tab;render()}else if(n.dataset.edit){openEditor(n.dataset.edit,n.dataset.context,n)}else if(n.dataset.close){closeDialog(n.dataset.close)}else if(n.dataset.inspect){inspect(n.dataset.inspect,n)}else if(n.hasAttribute('data-default-reason')){document.getElementById('reason').value=byId[editContext.id].reason;document.getElementById('dsl-preview').textContent=preview(editorValue())}else if(n.dataset.change){changeState=n.dataset.change;render();toast(changeState==='draft'?'建议已存为待审草案；尚未加载。':'已拒绝这条示例建议。')}});
document.addEventListener('change',e=>{if(e.target.id==='domain'){domain=e.target.value;render()}else if(e.target.id==='category'){category=e.target.value;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;const caret=e.target.selectionStart;render();const n=document.getElementById('search');n.focus();if(n.type!=='search')n.setSelectionRange(caret,caret)}else if(e.target.closest('#rule-form')&&!editContext.locked){document.getElementById('dsl-preview').textContent=preview(editorValue())}});
document.addEventListener('submit',e=>{if(e.target.id!=='rule-form')return;e.preventDefault();if(editContext.locked)return;const r=editorValue();if(!r.reason||!r.target){document.getElementById('form-error').textContent='请填写保护对象与反馈原因。';return}if(r.kind==='file'&&!r.target.startsWith('/')){document.getElementById('form-error').textContent='请使用绝对路径；可信侧还需解析实际对象。';return}if(editContext.context==='platform'){baselineDraft[r.id]=r;baselineRevision++}else taskDraft[r.id]=r;closeDialog('editor');render();toast(r.kind==='branch'?'分支策略需求已保存；当前不可执行。':'草案已保存，尚未编译、批准或加载。')});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=['permissions','changes','sources'],current=keys.indexOf(tab);tab=e.key==='Home'?keys[0]:e.key==='End'?keys[2]:keys[(current+(e.key==='ArrowRight'?1:2))%3];render();document.querySelector(`[data-tab="${tab}"]`).focus()});
for(const id of ['editor','inspector'])document.getElementById(id).addEventListener('cancel',()=>{if(lastOpener?.isConnected)lastOpener.focus()});
render();
</script>
</body>
</html>
