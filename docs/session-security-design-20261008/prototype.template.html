<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AgentScope · 平台底线与会话安全配置</title>
<style>
:root{--nav:#0f1c2e;--blue:#1f6feb;--bg:#f5f7fa;--line:#e3e8ef;--ink:#172b43;--muted:#63758a;--amber:#8c580c;--red:#ad322c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid #cbd5e1;background:white;color:var(--ink);border-radius:6px;padding:7px 12px;white-space:nowrap}
button:hover{background:#f0f5fd}
button:focus-visible,a:focus-visible{outline:3px solid #86b7ff;outline-offset:2px}
button.primary{background:var(--blue);color:white;border-color:var(--blue)}
button:disabled,input:disabled,select:disabled,textarea:disabled{cursor:not-allowed;opacity:.65}
input,select,textarea{border:1px solid #c7d2df;background:white;border-radius:6px;padding:8px 10px;color:var(--ink);max-width:100%}
textarea{width:100%;resize:vertical}
a{color:var(--blue)}
code,pre{font:12px/1.6 Consolas,monospace}
code{overflow-wrap:anywhere}
pre{background:#f3f6fa;padding:13px;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:340px;overflow:auto}
h2{font-size:16px;margin:0 0 5px}p{margin:0 0 12px}small,.muted{color:var(--muted)}
.shell{display:flex;min-height:100vh}
.sidebar{width:216px;flex-shrink:0;padding:24px 14px;background:var(--nav);color:#b6c7dc;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:10px;color:white;font-size:18px;padding:0 8px 25px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--blue);display:grid;place-items:center;font-weight:bold}
.nav{border:0;background:transparent;color:#cbd9e9;text-align:left;padding:11px 13px}
.nav.on{background:var(--blue);color:white}
.main{flex:1;min-width:0}
.topbar{min-height:66px;background:white;border-bottom:1px solid var(--line);padding:12px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.context,.page-actions,.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.context strong{font-size:15px}.context small{font-size:11px}.context select{padding:6px 9px;max-width:220px}
.page-actions{justify-content:flex-end}.page-actions button{font-size:12px}
.content{padding:18px 26px 35px;max-width:1400px}
.badge{font-size:11px;display:inline-block;padding:2px 7px;border-radius:4px;background:#eef2f7;color:#516478;white-space:nowrap}
.badge.blue{background:#e8f1ff;color:#235ca6}.badge.amber{background:#fff3dc;color:var(--amber)}.badge.red{background:#fdecea;color:var(--red)}
.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin:0 0 17px;overflow:auto}
.tabs button{border:0;border-radius:0;background:transparent;padding:8px 1px 11px;color:var(--muted)}
.tabs button.on{border-bottom:2px solid var(--blue);color:var(--blue);font-weight:bold}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.toolbar input{flex:1;min-width:170px}.toolbar select{min-width:135px}.record-count{font-size:12px;color:var(--muted);white-space:nowrap}
.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--muted);font-weight:normal;background:#f8fafc;white-space:nowrap}
td,th{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafcff}
td strong{display:block;font-size:13px;font-weight:600;line-height:1.55}
td small{display:block;font-size:11px;margin-top:4px}
td code{display:block;color:#5c718a;margin-top:4px;font-size:11px}
td:last-child{text-align:right;white-space:nowrap}
.rules-table td:first-child{width:37%;min-width:225px}.rules-table td:not(:first-child){white-space:nowrap}
.rules-table td:nth-child(4){min-width:115px}.platform-table td:first-child{width:25%;min-width:180px}
.platform-table td:nth-child(2){width:30%;min-width:175px}
.text-action{border:0;background:transparent;padding:5px 0;color:var(--blue);font-size:12px}
.text-action:hover{background:transparent;text-decoration:underline}
.source-label{color:#52677e}.record-effect{color:#224e82}.record-effect.semantic{color:var(--amber)}
.empty{padding:35px;text-align:center;color:var(--muted)}
.lineage{font-size:12px;color:var(--muted);margin:2px 0 14px}
.change-path{white-space:normal;max-width:260px}
.notice{background:#fff7e7;color:#79500f;border:1px solid #f1dcaf;border-radius:6px;padding:10px 12px;margin:12px 0;font-size:12px}
.notice.info{background:#edf4ff;border-color:#d3e3fd;color:#2a527e}
dialog{border:0;border-radius:10px;padding:0;width:min(650px,94vw);max-height:92vh;box-shadow:0 18px 75px #102d4c40;color:var(--ink)}
dialog::backdrop{background:#0f1c2e65}
.dialog-head{position:sticky;top:0;background:white;border-bottom:1px solid var(--line);padding:17px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:2}
.dialog-head h2{margin:0}.dialog-head small{display:block;font-size:11px}
.dialog-body{padding:18px 22px}.dialog-body table td:first-child{width:150px}
.field{display:block;margin:15px 0}.field>span{display:block;font-size:12px;font-weight:600;margin-bottom:6px}
.field>input:not([type=checkbox]),.field>select{width:100%}.field small{display:block;font-size:11px;margin-top:5px}
.check{display:flex;align-items:center;gap:8px;font-size:12px}.check input{accent-color:var(--blue)}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field-grid .field{margin:0}
.dialog-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:15px;border-top:1px solid var(--line);margin-top:20px;font-size:12px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:13px 16px;margin:0}.kv dt{color:var(--muted);font-size:12px}.kv dd{margin:0;overflow-wrap:anywhere}
.reason-block{margin-top:20px;border-top:1px solid var(--line);padding-top:15px}.reason-block label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}
.reason-block p{font-size:13px;margin:0}
details{border-top:1px solid var(--line);margin-top:18px;padding-top:12px}summary{cursor:pointer;font-size:12px;color:#49647e}
.evidence-list{padding-left:19px;font-size:12px}.evidence-list li{margin:9px 0}.error{color:var(--red);font-size:12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:6px;background:var(--nav);color:white;z-index:10;max-width:92vw;font-size:12px}
.sr{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
@media(max-width:1000px){.sidebar{width:185px}.content{padding:17px 18px}.topbar{padding:12px 18px;align-items:flex-start}.rules-table td:first-child{width:auto}td,th{padding:13px 12px}}
@media(max-width:700px){.shell{display:block}.sidebar{width:100%;padding:10px 12px;flex-direction:row;align-items:center;gap:5px}.brand{padding:0;margin-right:auto;font-size:16px}.logo{width:27px;height:27px}.nav{padding:7px 9px;font-size:12px}.topbar{padding:12px 14px;flex-wrap:wrap;gap:9px}.context{gap:8px}.context strong{font-size:14px}.context select{max-width:185px}.page-actions{gap:8px}.content{padding:14px}.tabs{gap:20px}.toolbar{gap:8px}.toolbar input{min-width:140px}.toolbar select{min-width:110px}.field-grid{grid-template-columns:1fr}.dialog-body{padding:15px 17px}.dialog-head{padding:14px 17px}.kv{grid-template-columns:75px 1fr;gap:11px 12px}
.records thead{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
.records tbody tr{display:grid;grid-template-columns:1fr 1fr;padding:14px;gap:11px 14px;border-bottom:1px solid var(--line)}
.records tbody tr:last-child{border-bottom:0}.records td{padding:0;border:0;min-width:0!important;width:auto!important;white-space:normal!important;text-align:left}
.records td::before{content:attr(data-label);display:block;color:var(--muted);font-size:10px;margin-bottom:3px}
.records td:first-child{grid-column:1/-1}.records td:first-child::before{display:none}.records td:last-child{text-align:right;align-self:end;grid-column:1/-1}.records td:last-child::before{display:none}
.records td strong{font-size:13px}.records td code{white-space:normal;overflow-wrap:anywhere}.record-count{margin-left:auto}
}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar"><div class="brand"><div class="logo">A</div><div>AgentScope</div></div><button class="nav on" data-page="session">◈ 会话安全</button><button class="nav" data-page="platform">▤ 平台安全底线</button></aside>
<main class="main"><header class="topbar"><div class="context" id="context"></div><div class="page-actions"><span class="badge amber">原型 · 未连接</span><div id="page-actions"></div></div></header><div class="content" id="content"></div></main>
</div>
<dialog id="editor" aria-labelledby="editor-title"></dialog><dialog id="inspector" aria-labelledby="inspector-title"></dialog><div id="toast" class="toast" role="status" hidden></div>
<script id="catalogue-data" type="application/json">__CATALOGUE_JSON__</script>
<script>
'use strict';
const catalogue=JSON.parse(document.getElementById('catalogue-data').textContent);
const templates=catalogue.templates, byId=Object.fromEntries(templates.map(t=>[t.id,t]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actionName={block:'阻止 + 反馈',notify:'仅通知',kill:'终止违规进程（事后）'};
const opName={read:'读取',open:'打开',write:'写入',unlink:'删除',exec:'执行',connect:'连接',commit:'提交',review:'检查内容'};
const clone=o=>JSON.parse(JSON.stringify(o));
const defaults=Object.fromEntries(templates.map(t=>[t.id,{...clone(t),enabled:['P01','P02','P04'].includes(t.id)}]));
const baselineDraft=clone(defaults),sessionBaseline=clone(defaults);
const taskDraft=clone(defaults);taskDraft.P06.enabled=true;taskDraft.P11.enabled=true;taskDraft.P15.enabled=true;
taskDraft.C01={...clone(defaults.P06),id:'C01',name:'测试子 Agent 写入范围',target:'/workspace/tests/**',enabled:true};byId.C01=clone(taskDraft.C01);
let page='session',tab='permissions',domain='D-A',category='all',search='',changeState='pending',editContext=null,lastOpener=null;
let baselineRevision=1,toastTimer,sessionFilter='all',sessionSearch='';
function toast(message){const n=document.getElementById('toast');n.textContent=message;n.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>n.hidden=true,4500)}
function selectedRules(){
  const local=domain==='D-B'?['P13','P15']:['P06','P11','P15'];
  return [
    ...['P01','P02','P04'].map(id=>({...sessionBaseline[id],inherited:true,sourceLabel:'平台底线',sourceDetail:'基线 v0.1'})),
    ...local.map(id=>({...taskDraft[id],inherited:domain==='D-A1',sourceLabel:domain==='D-A1'?'父任务':id==='P15'?'用户设置':'场景 Agent',sourceDetail:domain==='D-A1'?'来自 D-A':''})),
    ...(domain==='D-A1'?[{...taskDraft.C01,inherited:false,sourceLabel:'场景 Agent',sourceDetail:'本会话新增'}]:[])
  ];
}
function capability(rule){if(rule.kind==='branch')return '缺少可信分支识别与事前控制';if(rule.kind==='semantic')return '内容 / Agent 检查';if(['argv','gate'].includes(rule.kind))return '命令参数仅支持事后处置';if(rule.kind==='flow')return '需要数据流和网络覆盖验收';if(rule.kind==='network')return '需要端点与连接覆盖验收';return '可编译为 OS 规则 · 待验收'}
function ruleTable(rules){
  return `<div class="panel"><div class="table-wrap"><table class="records rules-table" aria-label="会话安全规则">
    <thead><tr><th>规则 / 保护对象</th><th>操作</th><th>处置</th><th>来源</th><th>状态</th><th></th></tr></thead>
    <tbody>${rules.map(r=>`<tr data-rule="${r.id}">
      <td data-label="规则"><strong>${esc(r.name)}</strong><code>${esc(r.target)}</code></td>
      <td data-label="操作">${['P06','C01'].includes(r.id)?'范围外写入':opName[r.operation]}</td>
      <td data-label="处置"><span class="record-effect ${r.kind==='semantic'?'semantic':''}">${r.kind==='semantic'?'内容检查 / 提醒':esc(actionName[r.effect])}</span></td>
      <td data-label="来源"><span class="source-label">${esc(r.sourceLabel)}</span>${r.inherited?'<small>继承 · 不可关闭</small>':''}</td>
      <td data-label="状态"><span class="badge">未加载</span></td>
      <td><button class="text-action" data-edit="${r.id}" data-context="session">${r.inherited?'查看':'配置'}</button></td>
    </tr>`).join('')}</tbody></table></div>${rules.length?'':'<div class="empty">没有匹配的规则</div>'}</div>`;
}
function renderSession(){
  const all=selectedRules(),rules=all.filter(r=>(sessionFilter==='all'||(sessionFilter==='inherited')===r.inherited)&&`${r.name} ${r.target}`.toLowerCase().includes(sessionSearch.toLowerCase()));
  const tabs=`<div class="tabs" role="tablist" aria-label="会话安全视图">${[['permissions','安全规则'],['changes','待处理变更'],['sources','来源']].map(([key,name])=>`<button role="tab" tabindex="${tab===key?'0':'-1'}" aria-selected="${tab===key}" data-tab="${key}" class="${tab===key?'on':''}">${name}${key==='changes'&&changeState==='pending'?' · 1':''}</button>`).join('')}</div>`;
  if(tab==='permissions')return tabs+`<div class="toolbar"><label class="sr" for="session-search">搜索会话规则</label><input id="session-search" type="search" placeholder="搜索规则或文件路径" value="${esc(sessionSearch)}"><label class="sr" for="session-source">规则来源</label><select id="session-source"><option value="all" ${sessionFilter==='all'?'selected':''}>全部来源</option><option value="inherited" ${sessionFilter==='inherited'?'selected':''}>继承规则</option><option value="local" ${sessionFilter==='local'?'selected':''}>本会话规则</option></select><span class="record-count">${rules.length} 条记录</span></div>`+ruleTable(rules);
  if(tab==='changes')return tabs+`<div class="panel"><div class="table-wrap"><table class="records" aria-label="待处理变更"><thead><tr><th>变更</th><th>范围</th><th>来源</th><th>状态</th><th></th></tr></thead><tbody><tr><td data-label="变更"><strong>测试子 Agent 写入范围</strong><small>D-A1</small></td><td data-label="范围" class="change-path"><code>/workspace/** → /workspace/tests/**</code></td><td data-label="来源">场景 Agent</td><td data-label="状态"><span class="badge ${changeState==='pending'?'amber':''}">${changeState==='pending'?'待处理':changeState==='draft'?'草案 · 未加载':'已拒绝'}</span></td><td><button class="text-action" data-inspect="change">查看</button></td></tr></tbody></table></div></div>`;
  const origins=[{name:'平台底线',version:'v0.1',scope:'D0 → 所有子域',count:3},...(domain==='D-B'?[{name:'研究任务',version:'任务草案',scope:'D-B',count:2}]:[{name:'编码任务',version:'任务草案',scope:'D-A',count:3}]),...(domain==='D-A1'?[{name:'测试子 Agent',version:'任务草案',scope:'D-A1',count:1}]:[])];
  return tabs+`<div class="lineage">${domain==='D-B'?'D0 → D-B':domain==='D-A1'?'D0 → D-A → D-A1':'D0 → D-A'}</div><div class="panel"><div class="table-wrap"><table class="records" aria-label="规则来源"><thead><tr><th>来源</th><th>版本</th><th>适用域</th><th>规则数</th><th></th></tr></thead><tbody>${origins.map(o=>`<tr><td data-label="来源"><strong>${o.name}</strong></td><td data-label="版本">${o.version}</td><td data-label="适用域">${o.scope}</td><td data-label="规则数">${o.count}</td><td><button class="text-action" data-inspect="sources">查看依据</button></td></tr>`).join('')}</tbody></table></div></div>`;
}
function renderPlatform(){
  const visible=templates.filter(t=>(category==='all'||t.category===category)&&(`${t.name}${t.target}${t.origin}`.toLowerCase().includes(search.toLowerCase())));
  return `<div class="toolbar"><label class="sr" for="search">搜索策略</label><input id="search" type="search" placeholder="搜索文件、Git、网络或策略名称" value="${esc(search)}"><label class="sr" for="category">策略类别</label><select id="category"><option value="all">全部类别</option>${[...new Set(templates.map(t=>t.category))].map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span class="record-count">${visible.length} 条记录</span></div>
    <div class="panel"><div class="table-wrap"><table class="records platform-table" aria-label="平台策略记录"><thead><tr><th>策略 / 来源</th><th>保护对象 / 操作</th><th>处置</th><th>草案</th><th></th></tr></thead><tbody>${visible.map(t=>{const r=baselineDraft[t.id];return `<tr data-rule="${r.id}"><td data-label="策略"><strong>${r.id} · ${esc(r.name)}</strong><small>${esc(r.origin)}</small></td><td data-label="对象 / 操作"><code>${esc(r.target)}</code>${opName[r.operation]}</td><td data-label="处置">${esc(actionName[r.effect])}</td><td data-label="草案"><span class="badge ${r.enabled?'blue':''}">${r.enabled?'已选用':'未选用'}</span>${r.kind==='branch'?'<small>暂不可执行</small>':''}</td><td><button class="text-action" data-edit="${r.id}" data-context="platform">配置</button></td></tr>`}).join('')}</tbody></table></div>${visible.length?'':'<div class="empty">没有匹配的模板</div>'}</div>`;
}
function render(){
  document.getElementById('context').innerHTML=page==='session'?`<strong>${domain==='D-B'?'研究任务 B':'登录表单修复'}</strong><small>S-DEMO</small><label class="sr" for="domain">查看策略域</label><select id="domain" aria-label="查看策略域"><option value="D-A" ${domain==='D-A'?'selected':''}>任务 A / D-A</option><option value="D-A1" ${domain==='D-A1'?'selected':''}>测试子 Agent / D-A1</option><option value="D-B" ${domain==='D-B'?'selected':''}>研究任务 B / D-B</option></select>`:`<strong>基线 v0.${baselineRevision}</strong><span class="muted">草案 · 新建会话</span>`;
  document.getElementById('page-actions').innerHTML=page==='session'?'<button data-inspect="check">检查安全配置</button>':'<button class="primary" data-inspect="draft">查看基线草案</button>';
  document.getElementById('content').innerHTML=page==='session'?renderSession():renderPlatform();
  document.querySelectorAll('[data-page]').forEach(n=>n.classList.toggle('on',n.dataset.page===page));
}
function openRuleDetails(r,opener){
  lastOpener=opener;const d=document.getElementById('inspector');
  d.innerHTML=`<div class="dialog-head"><h2 id="inspector-title">${esc(r.name)}</h2><button data-close="inspector" aria-label="关闭详情">×</button></div><div class="dialog-body"><dl class="kv"><dt>保护对象</dt><dd><code>${esc(r.target)}</code></dd><dt>操作</dt><dd>${['P06','C01'].includes(r.id)?'范围外写入':opName[r.operation]}</dd><dt>处置</dt><dd>${esc(actionName[r.effect])}</dd><dt>来源</dt><dd>${esc(r.sourceLabel)} · ${esc(r.sourceDetail)}<small>（继承规则，不可在本会话关闭）</small></dd><dt>状态</dt><dd>未加载 · 未验证</dd></dl><div class="reason-block"><label>反馈原因</label><p>${esc(r.reason)}</p></div><details><summary>技术与来源</summary><p style="margin-top:12px;font-size:12px">${esc(capability(r))}。${esc(r.limitations)}</p>${evidenceHtml(r)}<pre>${esc(preview(r))}</pre></details><div class="dialog-footer"><small>继承规则只读</small><button data-close="inspector">关闭</button></div></div>`;d.showModal();
}
function evidenceHtml(r){return r.evidence_uids.length?`<ul class="evidence-list">${r.evidence_uids.map(uid=>{const e=catalogue.evidence.find(x=>x.uid===uid);return `<li><a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">${esc(uid)} · 原文 ${esc(e.source_lines)} 行 ↗</a><br><span class="muted">${esc(e.directive.slice(0,550))}</span><br><a href="${esc(e.artifact_url)}" target="_blank" rel="noreferrer">冻结的 RQ1 策略 YAML</a></li>`}).join('')}</ul>`:'<p class="muted">来自用户需求或论文/架构扩展，没有直接对应的 RQ1 原文条目。</p>'}
function preview(r){const quoted=JSON.stringify(r.target),reason=JSON.stringify(r.reason);if(r.kind==='semantic')return '通用约束：'+r.reason+'\n执行方：Agent / 内容检查 / 权威业务接口\n不生成 OS 强制规则。';if(r.kind==='branch')return '配置意图（尚不可执行）：\nmain → '+actionName[r.mainEffect||'kill']+'\n其他分支 → '+actionName[r.otherEffect||'block']+'\n\n需要可信分支解析与事前引用更新控制；不生成 DSL。';if(r.kind==='argv'||r.kind==='gate'||r.kind==='flow')return JSON.stringify({status:'intent_only',target:r.target,effect:r.effect,reason:r.reason,required_checks:r.limitations},null,2);const fence=['P06','C01'].includes(r.id);let clause=r.kind==='network'?`${r.effect} connect endpoint "*" if AGENT unless target ${quoted}`:`${r.effect} ${r.operation} file ${fence?'"*"':quoted} if AGENT${fence?' unless target '+quoted:''}`;return `# 待可信路径解析、能力检查与独立验收的示例\nsource AGENT = exec "**"\nrule ${r.id.toLowerCase()}-draft:\n  ${clause}\n  because ${reason}`}
function openEditor(id,context,opener){lastOpener=opener;const r=context==='platform'?baselineDraft[id]:selectedRules().find(t=>t.id===id),locked=context==='session'&&r.inherited;if(locked){openRuleDetails(r,opener);return}editContext={id,context,locked};const dialog=document.getElementById('editor');dialog.innerHTML=`<div class="dialog-head"><div><h2 id="editor-title">${esc(r.name)}</h2><small>${esc(r.origin)}</small></div><button data-close="editor" aria-label="关闭规则配置">×</button></div><form id="rule-form" class="dialog-body">${context==='platform'?`<label class="check"><input id="enabled" type="checkbox" ${r.enabled?'checked':''}>纳入平台基线草案</label>`:''}<label class="field"><span>保护对象 / 目标</span><input id="target" value="${esc(r.target)}" maxlength="2048" ${locked||['branch','argv','gate','flow','semantic'].includes(r.kind)?'disabled':''}><small>示例路径，可按实际环境调整。</small></label>${r.kind==='branch'?`<div class="field-grid"><label class="field"><span>提交 main 时</span><select id="main-effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${(r.mainEffect||'kill')===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>提交其他分支时</span><select id="other-effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${(r.otherEffect||'block')===k?'selected':''}>${v}</option>`).join('')}</select></label></div><div class="notice" style="margin-top:14px">此处用于记录你的配置需求。当前后端不能从 git commit 参数识别实际分支，带参数的事前 block 也不受支持。保存后仍是不可执行的需求草案。</div>`:`<div class="field-grid"><label class="field"><span>操作</span><select id="operation" ${locked||!['file'].includes(r.kind)?'disabled':''}>${(r.kind==='file'?['read','open','write','unlink']:[r.operation]).map(k=>`<option value="${k}" ${r.operation===k?'selected':''}>${opName[k]}</option>`).join('')}</select></label><label class="field"><span>处置方式</span><select id="effect" ${locked?'disabled':''}>${Object.entries(actionName).map(([k,v])=>`<option value="${k}" ${r.effect===k?'selected':''} ${k==='block'&&['argv','gate'].includes(r.kind)||r.kind==='semantic'&&k!=='notify'?'disabled':''}>${v}</option>`).join('')}</select></label></div>`}<label class="field"><span>反馈给 Agent 的原因</span><textarea id="reason" rows="3" maxlength="500" required ${locked?'disabled':''}>${esc(r.reason)}</textarea><small>写明限制原因与可行的下一步；最多 500 字符。</small></label><button type="button" data-default-reason ${locked?'disabled':''}>使用默认反馈</button><details><summary>技术与来源</summary><p style="margin-top:12px;font-size:12px">${esc(capability(r))}。${esc(r.limitations)}</p>${evidenceHtml(r)}<pre id="dsl-preview">${esc(preview(r))}</pre></details><div id="form-error" class="error" role="alert"></div><div class="dialog-footer"><small>${locked?'继承规则只读':'仅保存草案 · 未加载'}</small><div class="row"><button type="button" data-close="editor">${locked?'关闭':'取消'}</button>${locked?'':`<button class="primary" type="submit">${r.kind==='branch'?'保存需求草案':'保存草案'}</button>`}</div></div></form>`;dialog.showModal()}
function editorValue(){const r=clone(editContext.context==='platform'?baselineDraft[editContext.id]:taskDraft[editContext.id]);r.target=document.getElementById('target').value.trim();r.reason=document.getElementById('reason').value.trim();if(document.getElementById('enabled'))r.enabled=document.getElementById('enabled').checked;if(r.kind==='branch'){r.mainEffect=document.getElementById('main-effect').value;r.otherEffect=document.getElementById('other-effect').value}else{r.operation=document.getElementById('operation').value;r.effect=document.getElementById('effect').value}return r}
function closeDialog(id){document.getElementById(id).close();if(lastOpener?.isConnected)lastOpener.focus()}
function inspect(kind,opener){
  lastOpener=opener;let title='',body='',footer='<button data-close="inspector">关闭</button>';
  if(kind==='check'){
    title='检查结果';
    body=`<dl class="kv"><dt>结论</dt><dd><span class="badge amber">未验证</span></dd><dt>继承规则</dt><dd>已锁定编辑</dd><dt>编译能力</dt><dd>未检查当前会话</dd><dt>批准与加载</dt><dd>缺少回执</dd><dt>进程绑定</dt><dd>缺少回执</dd><dt>阻断与反馈</dt><dd>尚无实测记录</dd></dl><div class="notice">缺少运行时证据，无法判断会话是否已受到保护。</div>`;
  }else if(kind==='change'){
    title='测试子 Agent 写入范围';
    body=`<dl class="kv"><dt>目标域</dt><dd>D-A1</dd><dt>来源</dt><dd>场景 Agent</dd><dt>原范围</dt><dd><code>/workspace/**</code></dd><dt>新范围</dt><dd><code>/workspace/tests/**</code></dd><dt>处置</dt><dd>阻止 + 反馈</dd><dt>状态</dt><dd>${changeState==='pending'?'待处理':changeState==='draft'?'草案 · 未加载':'已拒绝'}</dd></dl><div class="reason-block"><label>新增原因</label><p>测试任务已交给子 Agent，因此将写入权限缩小到 tests 目录。</p></div><div class="reason-block"><label>反馈原因</label><p>你是测试子 Agent，请仅修改 tests 目录；产品代码变更请交回主 Agent。</p></div><details><summary>影响范围与生效条件</summary><p style="margin-top:12px">只影响 D-A1 及其后代；不能解除父域约束。尚未编译、批准或加载。</p></details>`;
    if(changeState==='pending')footer='<button data-change="rejected">拒绝</button><button class="primary" data-change="draft">存为待审草案</button>';
  }else if(kind==='draft'){
    title=`基线 v0.${baselineRevision}`;const rules=Object.values(baselineDraft).filter(r=>r.enabled);
    const data={schema:'agentscope.baseline.intent.v1',version:'draft-0.'+baselineRevision,runtime_applied:false,rules:rules.map(r=>({template_id:r.id,target:r.target,operation:r.operation,effect:r.effect,reason:r.reason,execution_status:'unverified_intent',dsl_preview_available:['file','network'].includes(r.kind),needs_capability_and_runtime_validation:true,...(r.kind==='branch'?{main:r.mainEffect||'kill',other:r.otherEffect||'block'}:{})}))};
    body=`<p class="muted">${rules.length} 条已选用 · 面向新建会话 · 未加载</p><table><thead><tr><th>策略</th><th>操作</th><th>处置</th></tr></thead><tbody>${rules.map(r=>`<tr><td>${esc(r.name)}</td><td>${opName[r.operation]}</td><td>${esc(actionName[r.effect])}</td></tr>`).join('')}</tbody></table><details><summary>技术记录（JSON）</summary><pre>${esc(JSON.stringify(data,null,2))}</pre></details>`;
  }else{
    title='研究依据';
    body=`<p><a href="${catalogue.paper}" target="_blank" rel="noreferrer">ActPlane 论文 v2</a></p><p class="muted">607 份独立策略，15 类候选模板。原始研究条目需要重新审查和验收。</p><ul class="evidence-list">${catalogue.evidence.map(e=>`<li><a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">${esc(e.uid)} · ${esc(e.source_lines)} 行</a></li>`).join('')}</ul><details><summary>材料版本与修订边界</summary><p style="margin-top:12px">392 per-event，215 cross-event；.ssh 来自用户需求扩展。编译通过不代表语义等价或真实保护已生效。</p><code>${catalogue.artifact_commit}</code></details>`;
  }
  const d=document.getElementById('inspector');d.innerHTML=`<div class="dialog-head"><h2 id="inspector-title">${title}</h2><button data-close="inspector" aria-label="关闭详情">×</button></div><div class="dialog-body">${body}<div class="dialog-footer"><small>原型 · 未连接运行时</small><div class="row">${footer}</div></div></div>`;d.showModal();
}
document.addEventListener('click',e=>{const n=e.target.closest('button');if(!n)return;if(n.dataset.page){page=n.dataset.page;render()}else if(n.dataset.tab){tab=n.dataset.tab;render()}else if(n.dataset.edit){openEditor(n.dataset.edit,n.dataset.context,n)}else if(n.dataset.close){closeDialog(n.dataset.close)}else if(n.dataset.inspect){inspect(n.dataset.inspect,n)}else if(n.hasAttribute('data-default-reason')){document.getElementById('reason').value=byId[editContext.id].reason;document.getElementById('dsl-preview').textContent=preview(editorValue())}else if(n.dataset.change){changeState=n.dataset.change;document.getElementById('inspector').close();render();toast(changeState==='draft'?'建议已存为待审草案；尚未加载。':'已拒绝这条示例建议。')}});
document.addEventListener('change',e=>{if(e.target.id==='domain'){domain=e.target.value;sessionFilter='all';sessionSearch='';render()}else if(e.target.id==='category'){category=e.target.value;render()}else if(e.target.id==='session-source'){sessionFilter=e.target.value;render()}});
document.addEventListener('input',e=>{if(['search','session-search'].includes(e.target.id)){const id=e.target.id;if(id==='search')search=e.target.value;else sessionSearch=e.target.value;render();document.getElementById(id).focus()}else if(e.target.closest('#rule-form')&&!editContext.locked){document.getElementById('dsl-preview').textContent=preview(editorValue())}});
document.addEventListener('submit',e=>{if(e.target.id!=='rule-form')return;e.preventDefault();if(editContext.locked)return;const r=editorValue();if(!r.reason||!r.target){document.getElementById('form-error').textContent='请填写保护对象与反馈原因。';return}if(r.kind==='file'&&!r.target.startsWith('/')){document.getElementById('form-error').textContent='请使用绝对路径；可信侧还需解析实际对象。';return}if(editContext.context==='platform'){baselineDraft[r.id]=r;baselineRevision++}else taskDraft[r.id]=r;closeDialog('editor');render();toast(r.kind==='branch'?'分支策略需求已保存；当前不可执行。':'草案已保存，尚未编译、批准或加载。')});
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')!=='tab'||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const keys=['permissions','changes','sources'],current=keys.indexOf(tab);tab=e.key==='Home'?keys[0]:e.key==='End'?keys[2]:keys[(current+(e.key==='ArrowRight'?1:2))%3];render();document.querySelector(`[data-tab="${tab}"]`).focus()});
for(const id of ['editor','inspector'])document.getElementById(id).addEventListener('cancel',()=>{if(lastOpener?.isConnected)lastOpener.focus()});
render();
</script>
</body>
</html>
