  <style>

    #as-unified-catalog *{box-sizing:border-box}#as-unified-catalog button,#as-unified-catalog input,#as-unified-catalog select,#as-unified-catalog textarea{font:inherit}#as-unified-catalog button{cursor:var(--cursor-interaction,pointer)}#as-unified-catalog button:disabled{opacity:.5;cursor:not-allowed}#as-unified-catalog .as-shell{display:grid;grid-template-columns:155px minmax(0,1fr);min-height:650px}#as-unified-catalog .as-nav{padding:23px 12px;background:var(--as-nav);color:var(--as-navtext)}#as-unified-catalog .as-brand{display:flex;align-items:center;gap:9px;padding:0 8px 25px;font-weight:600}#as-unified-catalog .as-logo{display:grid;place-items:center;background:light-dark(#2169df,#2169df);color:light-dark(#fff,#fff);border-radius:8px;width:29px;height:29px}#as-unified-catalog .as-nav button{display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;padding:10px 12px;border-radius:6px;margin:3px 0}#as-unified-catalog .as-nav button.as-current{background:light-dark(#2264dc,#2264dc);color:light-dark(#fff,#fff)}#as-unified-catalog .as-nav .as-child{padding-left:28px}#as-unified-catalog .as-main{min-width:0}#as-unified-catalog .as-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 24px;background:var(--as-surface);border-bottom:1px solid var(--as-line);padding-right:96px}#as-unified-catalog .as-top span{color:var(--as-muted)}#as-unified-catalog .as-demo{padding:8px 24px;background:var(--as-softamber);color:var(--as-amber);font-size:12px}#as-unified-catalog .as-content{padding:21px 24px}#as-unified-catalog .as-tabs{display:flex;gap:24px;border-bottom:1px solid var(--as-line);margin-bottom:22px;flex-wrap:wrap}#as-unified-catalog .as-tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:0 0 11px;color:var(--as-muted)}#as-unified-catalog .as-tabs button[aria-selected=true]{color:var(--as-blue);border-color:var(--as-blue);font-weight:600}#as-unified-catalog .as-toolbar{display: var(--as-bg)}#as-unified-catalog .as-parent strong{font-weight:600}#as-unified-catalog .as-template-toggle{border:0;background:transparent;color:var(--as-ink);text-align:left;padding:0;font-weight:600}#as-unified-catalog .as-tree{display:flex;align-items:flex-start;gap:9px;padding-left:9px}#as-unified-catalog .as-branch{color:var(--as-muted)}#as-unified-catalog .as-tag{display:inline-block;border-radius:4px;padding:2px 6px;font-size:12px;background:var(--as-selected);color:var(--as-blue)}#as-unified-catalog .as-tag.as-ok{background:var(--as-softgreen);color:var(--as-green)}#as-unified-catalog .as-tag.as-wait{background:var(--as-softamber);color:var(--as-amber)}#as-unified-catalog .as-row-actions{display:flex;flex-direction:column;gap:4px;align-items:flex-start}#as-unified-catalog .as-bottom-note{margin-top:13px;color:var(--as-muted);font-size:12px}#as-unified-catalog .as-notice{padding:10px 12px;margin:0 0 15px;background:var(--as-softgreen);color:var(--as-green);border-radius:6px}#as-unified-catalog .as-error{padding:10px 12px;margin-bottom:12px;background:var(--as-softamber);color:var(--as-danger)}#as-unified-catalog .as-backline{display:flex;align-items:center;gap:13px;margin-bottom:19px;flex-wrap:wrap}#as-unified-catalog h2{font-size:17px;margin:0;font-weight:600}#as-unified-catalog h3{font-size:14px;margin:0 0 12px;font-weight:600}#as-unified-catalog p{margin:5px 0}#as-unified-catalog .as-editor-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(220px,1fr);gap:22px}#as-unified-catalog .as-form{background:var(--as-surface);border:1px solid var(--as-line);border-radius:8px;padding:19px;min-width:0}#as-unified-catalog .as-form label.as-field{margin-bottom:17px}#as-unified-catalog .as-group{padding-top:18px;margin-top:18px;border-top:1px solid var(--as-line)}#as-unified-catalog fieldset{padding:0;margin:0 0 17px;border:0;min-width:0}#as-unified-catalog legend{font-weight:500;margin-bottom:8px;padding:0}#as-unified-catalog .as-radio{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;margin:6px 0;border:1px solid var(--as-line);border-radius:6px}#as-unified-catalog .as-radio:has(input:checked){border-color:var(--as-blue);background:var(--as-selected)}#as-unified-catalog input[type=radio],#as-unified-catalog input[type=checkbox]{accent-color:var(--as-blue);flex-shrink:0;margin-top:5px}#as-unified-catalog .as-check{display:flex;gap:8px;align-items:flex-start;margin:11px 0;font-size:13px}#as-unified-catalog .as-callout{padding:12px;border-radius:6px;background:var(--as-softamber);color:var(--as-amber);font-size:13px;margin:10px 0}#as-unified-catalog .as-summary{min-width:0}#as-unified-catalog .as-summary dl{margin:0}#as-unified-catalog .as-summary dt{color:var(--as-muted);font-size:12px;margin-top:14px}#as-unified-catalog .as-summary dd{margin:3px 0 0;overflow-wrap:anywhere}#as-unified-catalog .as-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}#as-unified-catalog pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;background:var(--as-bg);padding:14px;border-radius:6px;font:12px/1.7 Consolas,monospace;color:var(--as-ink)}#as-unified-catalog .as-receipt{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--as-line);font-size:13px}#as-unified-catalog .as-plan{padding:13px 0;border-bottom:1px solid var(--as-line)}#as-unified-catalog .as-plan-title{display:flex;align-items:center;justify-content:space-between;gap:12px}#as-unified-catalog .as-plan-label{font-size:12px;color:var(--as-muted)}#as-unified-catalog .as-audit-row{padding:14px 0;border-bottom:1px solid var(--as-line)}#as-unified-catalog .as-example-pill{font-size:12px;color:var(--as-muted)}#as-unified-catalog .as-saved-name{overflow-wrap:anywhere}#as-unified-catalog .as-empty{padding:27px;text-align:center;color:var(--as-muted)}
    @media(max-width:780px){#as-unified-catalog .as-shell{grid-template-columns:58px minmax(0,1fr)}#as-unified-catalog .as-nav{padding:18px 6px}#as-unified-catalog .as-brand{padding:0 8px 18px}#as-unified-catalog .as-brand-name,#as-unified-catalog .as-nav-name{display:none}#as-unified-catalog .as-nav button,#as-unified-catalog .as-nav .as-child{padding:11px 12px}#as-unified-catalog .as-top{padding:15px 14px;padding-right:95px}#as-unified-catalog .as-content{padding:18px 15px}#as-unified-catalog .as-demo{padding:8px 15px}#as-unified-catalog .as-editor-grid{grid-template-columns:minmax(0,1fr)}#as-unified-catalog .as-summary{border-top:1px solid var(--as-line);padding-top:18px}#as-unified-catalog .as-form{padding:14px}#as-unified-catalog .as-scope-filter{width:100%}#as-unified-catalog .as-tabs{gap:19px}}
    @media(pointer:coarse){#as-unified-catalog button{min-height:44px}#as-unified-catalog input:not([type=checkbox]):not([type=radio]),#as-unified-catalog select,#as-unified-catalog textarea{font-size:16px}}
  </style>
  <div class="as-shell">
    <aside class="as-nav" aria-label="AgentScope 导航">
      <div class="as-brand"><span class="as-logo">A</span><span class="as-brand-name">AgentScope</span></div>
      <button type="button" data-nav="overview" aria-label="总览"><span aria-hidden="true">◫</span> <span class="as-nav-name">总览</span></button>
      <button type="button" data-nav="connections" aria-label="Agent连接"><span aria-hidden="true">⇄</span> <span class="as-nav-name">Agent连接</span></button>
      <button type="button" data-nav="sessions" aria-label="会话" class="as-child"><span aria-hidden="true">▤</span> <span class="as-nav-name">会话</span></button>
      <button type="button" data-nav="approvals" aria-label="审批"><span aria-hidden="true">✓</span> <span class="as-nav-name">审批</span></button>
      <button type="button" data-nav="agent" aria-label="Agent"><span aria-hidden="true">◇</span> <span class="as-nav-name">Agent</span></button>
      <button type="button" data-nav="system" aria-label="系统" class="as-current"><span aria-hidden="true">▣</span> <span class="as-nav-name">系统</span></button>
      <button type="button" data-nav="history" aria-label="任务历史"><span aria-hidden="true">◷</span> <span class="as-nav-name">任务历史</span></button>
    </aside>
    <main class="as-main">
      <div class="as-top"><div><span>AgentScope / </span><strong id="as-location">系统</strong></div></div>
      <div class="as-demo">设计预览 · 合成示例数据 · 操作仅演示，不连接真实服务</div>
      <div class="as-content" id="as-catalog-content"></div>
    </main>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('as-unified-catalog'),content=root.querySelector('#as-catalog-content');
    const agents=[{id:'demo-dsh-01',name:'DeepSeek Harness · 日报演示',sessions:'日报 A、核对 B'},{id:'demo-hermes-01',name:'Hermes · ERP 演示',sessions:'采购 C'}];
    const templates=[{id:'read',version:2,name:'文件读取限制',summary:'禁止读取指定文件或目录；范围在子配置中选择。',operation:'打开文件',effect:'阻止并反馈',capability:'ActPlane · 文件访问',enabled:true},{id:'mutate',version:2,name:'文件修改与删除限制',summary:'保护指定资料，明确显示修改与删除的实际覆盖。',operation:'修改与删除',effect:'阻止并反馈',capability:'ActPlane · 文件变更',enabled:true},{id:'native',version:1,name:'原生工具调用审批',summary:'对 Agent 原生工具调用增加人工审批。',operation:'工具调用',effect:'调用前审批',capability:'需要 Agent 原生适配器',enabled:false}];
    const seed=[{id:'c1',template:'read',name:'共享凭据目录保护',scope:'system',agent:null,stage:'baseline',path:'/srv/demo/shared/credentials/**',reason:'凭据不属于任务资料，使用公开样例配置。',intent:'both',accepted:false,source:'手工',revision:1,status:'active'},{id:'c2',template:'read',name:'日报任务隔离员工资料',scope:'agent',agent:'demo-dsh-01',stage:'baseline',path:'/srv/demo/orders/private/staff.csv',reason:'日报只使用订单数据；员工资料不属于本任务。',intent:'both',accepted:false,source:'配置 Agent',revision:2,status:'draft'},{id:'c3',template:'mutate',name:'保护开发约定',scope:'agent',agent:'demo-dsh-01',stage:'baseline',path:'/srv/demo/orders/AGENTS.md',reason:'保留既有开发约定，修改需求先交用户确认。',intent:'both',accepted:false,source:'手工',revision:1,status:'approved'}];
    let state={schema:2,page:'catalog',filter:'all',collapsed:{native:true},records:structuredClone(seed),activeRecords:{c1:structuredClone(seed[0])},activeVersion:4,events:[]};
    let editor=null,error='',notice='',detailTab='params',review=null,assistantTarget='demo-dsh-01',assistantText='生成订单日报，只用订单数据，不要读取员工资料。',assistantResult=false,assistantNone=false;
    const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const template=id=>templates.find(t=>t.id===id),agent=id=>agents.find(a=>a.id===id);
    const scopeLabel=r=>r.scope==='system'?'所有受控 Agent':agent(r.agent)?.name||'未选择 Agent';
    const statusLabel=r=>({active:'示例生效',draft:'草案',pending:'待审批',approved:'已批准 · 未应用',disabled:'示例停用'})[r.status]||'未知状态';
    const badge=r=>`<span class="as-tag ${r.status==='active'?'as-ok':r.status==='pending'||r.status==='approved'?'as-wait':''}">${statusLabel(r)}</span>${state.activeRecords[r.id]&&r.status!=='active'?`<small>当前仍生效：配置 v${state.activeRecords[r.id].revision}</small>`:''}`;
    function restore(incoming){if(incoming?.schema!==2||!Array.isArray(incoming.records)||!incoming.activeRecords)return;const valid=incoming.records.filter(r=>r&&templates.some(t=>t.id===r.template)&&['system','agent'].includes(r.scope)&&['baseline','runtime'].includes(r.stage)&&['active','draft','pending','approved','disabled'].includes(r.status)&&typeof r.id==='string'&&typeof r.name==='string'&&typeof r.path==='string'&&(r.scope==='system'||agents.some(a=>a.id===r.agent)));state={...state,...incoming,records:valid.slice(0,20),activeRecords:Object.fromEntries(Object.entries(incoming.activeRecords).filter(([id,r])=>valid.some(v=>v.id===id)&&r?.status==='active'&&templates.some(t=>t.id===r.template))),events:Array.isArray(incoming.events)?incoming.events.slice(-12):[]};if(!['catalog','assistant','approvals','generations','agent','sessions'].includes(state.page))state.page='catalog';}
    restore(window.openai?.widgetState?.privateContent?.state);
    function persist(){window.openai?.setWidgetState({modelContent:{screen:state.page,selectedScope:state.filter,configurations:state.records.map(r=>({name:r.name,template:template(r.template).name,scope:scopeLabel(r),stage:r.stage,status:r.status})),demo:true},privateContent:{state}})?.catch(()=>{});}
    function event(text){state.events.push(text);state.events=state.events.slice(-12);}
    const options=(current,empty=false)=>`${empty?'<option value="">请选择 Agent 实例</option>':''}${agents.map(a=>`<option value="${a.id}" ${a.id===current?'selected':''}>${esc(a.name)}（示例实例）</option>`).join('')}`;
    function tabs(selected){return `<div class="as-tabs" role="tablist" aria-label="系统模块"><button type="button" role="tab" data-page="catalog" aria-selected="${selected==='catalog'}">策略库</button><button type="button" role="tab" data-page="generations" aria-selected="${selected==='generations'}">生成记录</button></div>`;}
    function row(r,inherited=false){const t=template(r.template);return `<tr data-record="${esc(r.id)}"><td><div class="as-tree"><span class="as-branch">└</span><div><span class="as-saved-name">${esc(r.name)}</span><small>配置 v${r.revision} · ${esc(r.source)}${inherited?' · 继承，只读':''}</small></div></div></td><td>${esc(scopeLabel(r))}<small>${r.stage==='runtime'?'当前运行增量':'长期基线'}</small></td><td>${esc(r.path)}<small>${t.operation} · ${t.effect}</small></td><td>${badge(r)}</td><td><div class="as-row-actions"><button type="button" class="as-link" data-edit="${r.id}" ${inherited?'data-readonly="true"':''}>${inherited?'查看':'配置详情'}</button>${!inherited&&r.status==='draft'?`<button type="button" class="as-link" data-submit="${r.id}">提交审批</button>`:''}${!inherited&&r.status==='active'?`<button type="button" class="as-link" data-disable="${r.id}">申请停用</button>`:''}</div></td></tr>`;}
    function catalog(){let visible=state.records.filter(r=>state.filter==='all'||(state.filter==='system'?r.scope==='system':r.scope==='agent'&&r.agent===state.filter));return `${tabs('catalog')}<div class="as-toolbar"><label class="as-field as-scope-filter"><span>配置范围</span><select id="as-filter"><option value="all" ${state.filter==='all'?'selected':''}>全部配置</option><option value="system" ${state.filter==='system'?'selected':''}>所有受控 Agent 共享</option>${options(state.filter)}</select></label><div><button type="button" class="as-button as-primary" data-page="assistant">让 Agent 配置</button><small>选择模板、填参数，保存到同一策略库</small></div></div><div class="as-count">${templates.length} 个示例模板 · ${visible.length} 项子配置</div><div class="as-table-wrap"><table aria-label="统一策略库"><thead><tr><th>模板 / 子配置</th><th>适用范围 / 期限</th><th>保护对象 / 实际效果</th><th>配置状态</th><th>操作</th></tr></thead><tbody>${templates.map(t=>{const children=visible.filter(r=>r.template===t.id),expanded=!state.collapsed[t.id];return `<tr class="as-parent"><td><button type="button" class="as-template-toggle" data-collapse="${t.id}" aria-expanded="${expanded}">${expanded?'▾':'▸'} ${t.name}</button><small>${esc(t.summary)}</small></td><td>按子配置选择<small>模板 v${t.version} · ${t.enabled?'所有 / 指定 Agent':'适配能力未接入'}</small></td><td>${t.operation}<small>${t.effect}</small></td><td>${children.length} 项子配置</td><td><button type="button" class="as-link" data-new="${t.id}" ${t.enabled?'':'disabled'}>${t.enabled?'新增子配置':'暂不支持'}</button></td></tr>${expanded?children.map(r=>row(r)).join(''):''}`;}).join('')}</tbody></table></div><div class="as-bottom-note">系统策略与 Agent 策略共用目录、表单和审批入口；生效范围由每条子配置决定。</div>`;}
    function newEditor(id,source='手工'){const t=template(id);editor={id:null,template:id,name:'',scope:'agent',agent:state.filter.startsWith('demo-')?state.filter:'demo-dsh-01',stage:'baseline',path:'',reason:'',intent:'both',accepted:false,source,revision:0,status:'draft',readonly:false};if(state.filter==='system'){editor.scope='system';editor.agent=null;}detailTab='params';error='';notice='';render();}
    function effectiveSummary(r){return r.scope==='system'?'适用于当前及以后接入的所有受控 Agent。每个运行实例单独加载并返回回执。':r.stage==='runtime'?`作用于 ${esc(agent(r.agent)?.name||'所选 Agent')} 当前共享运行域；同域会话 ${esc(agent(r.agent)?.sessions||'全部')} 都受影响，结束来源会话不撤销此规则。`:`作用于所选 Agent 实例的所有工作区、会话及后续受控启动。其他 Agent 实例不加载该配置。`;}
    function editorView(){const r=editor,t=template(r.template),readonly=r.readonly,locked=!!r.id||readonly;return `${tabs('catalog')}<div class="as-backline"><button type="button" class="as-link" data-back="true">← 返回策略库</button><span class="as-muted">${t.name} / </span><h2>${r.id?esc(r.name):'新增子配置'}</h2></div><div class="as-editor-grid"><section class="as-form" aria-label="子配置详情"><div class="as-tabs" role="tablist" aria-label="子配置内容"><button type="button" role="tab" aria-selected="${detailTab==='params'}" data-detail="params">参数配置</button><button type="button" role="tab" aria-selected="${detailTab==='dsl'}" data-detail="dsl">DSL 预览</button><button type="button" role="tab" aria-selected="${detailTab==='receipts'}" data-detail="receipts">应用详情</button></div>${detailTab==='params'?`<form id="as-editor-form"><label class="as-field"><span>配置名称</span><input id="as-name" value="${esc(r.name)}" ${readonly?'disabled':''} placeholder="例如：日报任务隔离员工资料" maxlength="100"></label><fieldset ${locked?'disabled':''}><legend>适用范围</legend><label class="as-radio"><input type="radio" name="as-scope" value="system" ${r.scope==='system'?'checked':''}><span>所有受控 Agent<small>作为系统策略，共同继承</small></span></label><label class="as-radio"><input type="radio" name="as-scope" value="agent" ${r.scope==='agent'?'checked':''}><span>指定 Agent<small>只为一个已登记实例配置</small></span></label></fieldset>${r.scope==='agent'?`<label class="as-field"><span>Agent 实例</span><select id="as-agent" ${locked?'disabled':''}>${options(r.agent,true)}</select><small>按实例绑定，不按 DSH / Hermes 产品名批量绑定</small></label>`:''}<label class="as-field"><span>配置期限</span><select id="as-stage" ${locked?'disabled':''}><option value="baseline" ${r.stage==='baseline'?'selected':''}>长期基线</option><option value="runtime" ${r.stage==='runtime'?'selected':''} ${r.scope==='system'?'disabled':''}>当前运行增量（设计能力）</option></select><small>${r.scope==='system'?'全局运行增量批量广播暂不支持；长期系统基线按实例跟踪应用。':'运行增量影响同一执行域内的共享会话。'}</small></label><div class="as-group"><h3>模板参数</h3><label class="as-field"><span>保护对象路径</span><input id="as-path" value="${esc(r.path)}" ${readonly?'disabled':''} placeholder="/srv/demo/orders/private/staff.csv"><small>示例 Linux 执行环境路径；真实配置应选择目标 Agent 已验证的资源。</small></label>${r.template==='mutate'?`<label class="as-field"><span>期望限制</span><select id="as-intent" ${readonly?'disabled':''}><option value="both" ${r.intent==='both'?'selected':''}>修改与删除</option><option value="write" ${r.intent==='write'?'selected':''}>只限制写入</option><option value="delete" ${r.intent==='delete'?'selected':''}>只限制删除</option></select></label>${r.intent!=='both'?`<div class="as-callout">当前访问组无法单独区分写入与删除。实际将同时限制修改、创建、重命名和删除；精确限制“${r.intent==='write'?'只写入':'只删除'}”暂不支持。</div><label class="as-check"><input type="checkbox" id="as-coverage" ${r.accepted?'checked':''} ${readonly?'disabled':''}><span>我接受按“修改与删除”整体限制，并将该影响提交审批。</span></label>`:''}`:''}<label class="as-field"><span>阻止后的反馈</span><textarea id="as-reason" ${readonly?'disabled':''} placeholder="告诉 Agent 原因与可以继续使用的资料">${esc(r.reason)}</textarea></label></div>${readonly?'<div class="as-callout">当前生效快照只读。需要调整时到策略库发起新的变更审批。</div>':`<div class="as-actions"><button type="button" data-save="true" class="as-button as-primary">${r.id?'保存新版本（演示）':'保存子配置（演示）'}</button><button type="button" class="as-button" data-back="true">取消</button></div><small>保存仅形成草案；需提交审批、批准，再单独应用。</small>`}</form>`:detailTab==='dsl'?`<p class="as-muted">由模板生成的示意 DSL · 尚未编译或绑定执行源</p><pre>${esc(dsl(r))}</pre><p class="as-bottom-note">真实绑定由 Broker 根据目标实例解析。示意中的 AGENT 不代表已绑定任何进程。</p>`:receipts(r)}</section><aside class="as-summary"><h3>本次配置</h3><dl><dt>固定模板</dt><dd>${t.name} · v${t.version}</dd><dt>真实作用范围</dt><dd>${effectiveSummary(r)}</dd><dt>执行方式</dt><dd>${t.capability}<small>${t.operation} · ${t.effect}</small></dd><dt>配置来源</dt><dd>${esc(r.source)}${r.id?` · 配置 v${r.revision}`:''}</dd><dt>状态</dt><dd>${r.id?statusLabel(r):'尚未保存'}</dd></dl>${r.id?'<div class="as-callout">目标、期限与父模板已冻结。需要换目标时复制为新子配置，重新审批。</div>':''}</aside></div>`;}
    function dsl(r){return `// 设计示意；执行源需按真实实例绑定\n// 目标：${scopeLabel(r)}\nblock ${r.template==='mutate'?'write':'open'} file ${JSON.stringify(r.path||'<待填写>')} if AGENT\n  because ${JSON.stringify(r.reason||'<待填写>')}`;}
    function receipts(r){const requestedRevision=r.revision;r=state.activeRecords[r.id]||r;if(r.status!=='active'&&r.status!=='disabled')return '<div class="as-empty">尚无应用回执。保存或批准不会改变运行策略。</div>';const targets=r.scope==='system'?agents:[agent(r.agent)];return `${requestedRevision!==r.revision?'<p class="as-muted">当前生效：配置 v'+r.revision+'；配置 v'+requestedRevision+' 尚未应用。</p>':''}<span class="as-tag as-ok">${r.status==='disabled'?'示例已停用':'示例运行版本 v'+state.activeVersion}</span>${targets.filter(Boolean).map(a=>`<div class="as-receipt"><div>${esc(a.name)}<small>${esc(a.id)} · 合成回执</small></div><span>${r.status==='disabled'?'撤销已核对（演示）':'加载及绑定已核对（演示）'}</span></div>`).join('')}<p class="as-bottom-note">这里仅展示回执设计。真实应用可能部分成功，需逐实例展示失败、重试与未运行状态。</p>`;}
    function readForm(){if(!editor||detailTab!=='params')return;for(const [k,id] of [['name','as-name'],['path','as-path'],['reason','as-reason'],['agent','as-agent'],['stage','as-stage'],['intent','as-intent']]){const el=root.querySelector('#'+id);if(el&&!el.disabled)editor[k]=el.value;}const ack=root.querySelector('#as-coverage');if(ack)editor.accepted=ack.checked;}
    function save(){readForm();error='';if(!editor.name.trim()||!editor.path.trim()||!editor.reason.trim())error='请填写配置名称、保护对象路径和反馈内容。';else if(!editor.path.startsWith('/')||editor.path.includes('\n'))error='此示例使用 Linux 绝对路径，请填写 / 开头的单行路径。';else if(editor.scope==='agent'&&!agent(editor.agent))error='请选择一个已登记的 Agent 实例。';else if(editor.template==='mutate'&&editor.intent!=='both'&&!editor.accepted)error='精确区分写入 / 删除暂不支持；请明确接受整体覆盖，或返回修改参数。';if(error){render();return;}if(state.records.length>=20&&!editor.id){error='此预览最多保存 20 项示例配置。';render();return;}const isEdit=!!editor.id;let value={...editor,id:editor.id||'demo-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),revision:editor.revision+1,status:'draft'};delete value.readonly;value.agent=value.scope==='system'?null:value.agent;if(isEdit){state.records=state.records.map(r=>r.id===value.id?value:r);}else{state.records.push(value);}event(`${isEdit?'保存新版本':'新增子配置'}：${value.name} · ${scopeLabel(value)} · 草案`);notice=isEdit?'已保存新版本草案；既有运行版本保持不变。':'已追加独立子配置；其他子配置保持不变。';state.collapsed[value.template]=false;state.filter='all';editor=null;state.page='catalog';persist();render();}
    function approvals(){const selected=review?state.records.find(r=>r.id===review.id):null;return `<div class="as-backline"><h2>策略变更审批</h2><span class="as-example-pill">全流程演示</span></div>${selected?`<section class="as-form" aria-label="审批详情"><h3>${esc(selected.name)} · ${review.operation==='disable'?'停用':'应用'}申请</h3><dl class="as-summary"><dt>本次目标</dt><dd>${esc(scopeLabel(selected))}</dd><dt>实际影响</dt><dd>${effectiveSummary(selected)}</dd><dt>修改与删除覆盖</dt><dd>${selected.template==='mutate'?'限制完整文件变更访问组':'不涉及'}</dd></dl><label class="as-check"><input type="checkbox" id="as-review-ack"><span>我已核对配置版本、目标及共享影响（演示）。</span></label><div class="as-actions"><button type="button" class="as-button as-primary" data-decide="${selected.status==='approved'?'apply':'approve'}">${selected.status==='approved'?'单独应用（演示）':'批准（演示）'}</button><button type="button" class="as-button" data-decide="reject">${selected.status==='approved'?'撤回':'拒绝'}（演示）</button></div><small>批准不会应用；应用后应等待逐实例回执。</small></section>`:`<div class="as-table-wrap"><table aria-label="待处理策略变更"><thead><tr><th>配置</th><th>适用范围</th><th>状态</th><th>操作</th></tr></thead><tbody>${state.records.filter(r=>['pending','approved'].includes(r.status)).map(r=>`<tr><td>${esc(r.name)}</td><td>${esc(scopeLabel(r))}</td><td>${badge(r)}</td><td><button type="button" class="as-link" data-review="${r.id}">查看变更</button></td></tr>`).join('')||'<tr><td colspan="4" class="as-empty">没有待处理变更。</td></tr>'}</tbody></table></div>`}`;}
    function assistant(){return `<div class="as-backline"><button type="button" class="as-link" data-page="catalog">← 返回策略库</button><h2>让 Agent 配置</h2><span class="as-example-pill">Jev 选择 + Agent 填参 · 流程示例</span></div><div class="as-editor-grid"><section class="as-form"><label class="as-field"><span>先确定配置目标</span><select id="as-assistant-target"><option value="system" ${assistantTarget==='system'?'selected':''}>所有受控 Agent</option>${options(assistantTarget)}</select></label><label class="as-field"><span>安全要求</span><textarea id="as-request">${esc(assistantText)}</textarea></label><button type="button" class="as-button as-primary" data-assistant="select">模拟 Jev 选择模板</button>${assistantResult?`<div class="as-group" aria-live="polite">${assistantNone?'<div class="as-callout">示例选择器无法确定适用模板。请手工选择或补充要求；不生成自由 DSL。</div>':`<div class="as-plan"><div class="as-plan-title"><strong>文件读取限制</strong><span class="as-tag">模拟推荐</span></div><p class="as-muted">模板 v2 · 参数：保护路径、阻止后的反馈</p><small>这里为固定流程示例，未请求 Jev，也未运行模型。</small></div><div class="as-actions"><button type="button" class="as-button as-primary" data-assistant="fill">Agent 填参到表单（演示）</button></div>`}</div>`:''}</section><aside class="as-summary"><h3>同一份子配置</h3><div class="as-plan"><strong>Jev 判断</strong><small>从已授权模板集合中推荐；多项需求分别判断；无合适模板或把握不足时交人工。</small></div><div class="as-plan"><strong>配置 Agent 填参数</strong><small>调用模板详情和参数接口，提交草案；使用与手工相同的表单和校验。</small></div><div class="as-plan"><strong>用户批准，再显式应用</strong><small>选择模型不改变审批权限；运行回执决定实际状态。</small></div><p class="as-bottom-note">Jev 只获得做判断所需的最小内容；不发送凭据原文或文件内容。</p></aside></div>`;}
    function projection(){const a=agents[0],rows=Object.values(state.activeRecords).filter(r=>r.scope==='system'||r.agent===a.id);return `<div class="as-backline"><h2>${state.page==='sessions'?'日报 A · 当前安全约束':a.name}</h2><span class="as-example-pill">示例实例 · 运行版本 v${state.activeVersion}</span></div><p class="as-muted">同一共享执行域内，会话日报 A 与核对 B 看到相同的有效约束。</p><div class="as-table-wrap"><table aria-label="Agent 当前安全约束"><thead><tr><th>配置</th><th>继承 / 作用范围</th><th>保护对象 / 效果</th><th>状态</th><th>操作</th></tr></thead><tbody>${rows.map(r=>row(r,true).replace('data-readonly="true"','data-readonly="true" data-applied="true"')).join('')||'<tr><td colspan="5" class="as-empty">没有示例生效配置。</td></tr>'}</tbody></table></div><div class="as-actions"><button type="button" class="as-button" data-page="catalog">在策略库配置</button></div>`;}
    function render(){const loc=root.querySelector('#as-location');loc.textContent=editor?'系统':['catalog','assistant','generations'].includes(state.page)?'系统':state.page==='agent'?'Agent':state.page==='sessions'?'会话':'审批';root.querySelectorAll('[data-nav]').forEach(el=>el.classList.toggle('as-current',el.dataset.nav===(['catalog','assistant','generations'].includes(state.page)?'system':state.page)));content.innerHTML=(notice?`<div class="as-notice" role="status">${esc(notice)}</div>`:'')+(error?`<div class="as-error" role="alert">${esc(error)}</div>`:'')+(editor?editorView():state.page==='catalog'?catalog():state.page==='assistant'?assistant():state.page==='approvals'?approvals():state.page==='generations'?`${tabs('generations')}<p class="as-muted">手工与 Agent 配置共用记录，来源独立保留。</p>${state.events.map(e=>`<div class="as-audit-row">${esc(e)}<small>本地演示事件</small></div>`).join('')||'<div class="as-empty">尚无本次演示事件。</div>'}`:projection());}
    root.addEventListener('change',e=>{if(e.target.id==='as-filter'){state.filter=e.target.value;notice='';persist();render();}else if(e.target.name==='as-scope'){readForm();editor.scope=e.target.value;editor.agent=editor.scope==='agent'?(editor.agent||agents[0].id):null;editor.stage='baseline';error='';render();}else if(['as-stage','as-agent','as-intent'].includes(e.target.id)){readForm();if(e.target.id==='as-intent')editor.accepted=false;render();}else if(e.target.id==='as-assistant-target'){assistantTarget=e.target.value;assistantResult=false;render();}});
    root.addEventListener('submit',e=>{if(e.target.id==='as-editor-form'){e.preventDefault();save();}});
    root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;const d=b.dataset;error='';if(d.save)save();else if(d.new)newEditor(d.new);else if(d.edit){const r=d.applied==='true'?state.activeRecords[d.edit]:state.records.find(r=>r.id===d.edit);editor={...r,readonly:d.readonly==='true'};detailTab='params';notice='';render();}else if(d.collapse){state.collapsed[d.collapse]=!state.collapsed[d.collapse];persist();render();}else if(d.back){editor=null;state.page='catalog';notice='';render();}else if(d.detail){readForm();detailTab=d.detail;render();}else if(d.page||d.nav){const p=d.page||d.nav;if(['overview','connections','history'].includes(p)){notice='本次聚焦策略库设计，此入口未展开。';render();return;}editor=null;review=null;state.page=p==='system'?'catalog':p;notice='';persist();render();}else if(d.submit||d.disable){const r=state.records.find(r=>r.id===(d.submit||d.disable));r.status='pending';review={id:r.id,operation:d.disable?'disable':'apply'};r.pendingOperation=review.operation;state.page='approvals';notice='已形成示例变更，运行策略尚未改变。';event('提交审批：'+r.name);persist();render();}else if(d.review){const r=state.records.find(r=>r.id===d.review);review={id:r.id,operation:r.pendingOperation||'apply'};render();}else if(d.decide){const r=state.records.find(r=>r.id===review.id);if(d.decide!=='reject'&&!root.querySelector('#as-review-ack')?.checked){error='请先核对并确认本次目标和共享影响。';render();return;}if(d.decide==='approve'){r.status='approved';notice='已批准（演示）。运行版本仍为 v'+state.activeVersion+'；需要再次确认后单独应用。';event('批准：'+r.name);}else if(d.decide==='apply'){r.status=review.operation==='disable'?'disabled':'active';if(review.operation==='disable')delete state.activeRecords[r.id];else state.activeRecords[r.id]=structuredClone(r);state.activeVersion++;event((review.operation==='disable'?'示例停用：':'示例应用：')+r.name);review=null;notice='模拟回执已核对，示例运行版本 v'+state.activeVersion+'。真实服务未发生变化。';}else{r.status=review.operation==='disable'?'active':'draft';review=null;notice='已拒绝 / 撤回演示变更；运行版本保持 v'+state.activeVersion+'。';}persist();render();}else if(d.assistant==='select'){assistantText=root.querySelector('#as-request').value;assistantTarget=root.querySelector('#as-assistant-target').value;assistantResult=true;assistantNone=!/订单|日报|员工|凭据|读取/.test(assistantText);render();}else if(d.assistant==='fill'){newEditor('read','Jev 推荐 + 配置 Agent（演示）');editor.scope=assistantTarget==='system'?'system':'agent';editor.agent=assistantTarget==='system'?null:assistantTarget;editor.name=assistantTarget==='system'?'共享凭据保护（助手草案）':'日报任务隔离员工资料（助手草案）';editor.path=assistantTarget==='system'?'/srv/demo/shared/credentials/**':'/srv/demo/orders/private/staff.csv';editor.reason=assistantTarget==='system'?'使用公开样例配置；凭据不属于任务资料。':'日报只使用订单数据；请继续读取 orders.csv。';notice='Agent 参数已填入手工同款表单（演示），等待检查与保存。';render();}});
    window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.privateContent?.state;if(!incoming||JSON.stringify(incoming)===JSON.stringify(state))return;restore(incoming);editor=null;review=null;render();});
    render();
  })();
  </script>
</div>
